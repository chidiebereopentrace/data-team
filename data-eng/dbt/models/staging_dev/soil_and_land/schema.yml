version: 2

models:
  - name: stg_isric_africa_soil
    description: "ISRIC Africa soil properties by depth (wide); drops fully-null soil rows"
    columns:
      - name: isric_africa_soil_sk
        description: "Surrogate key over business grain"
        tests:
          - unique
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 30

  - name: stg_isda_soil_enriched
    description: "Enriched iSDA soil properties (long: property + depth + value)"
    columns:
      - name: isda_soil_enriched_sk
        description: "Surrogate key over business grain"
        tests:
          - unique
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: soil_property
        tests:
          - not_null
      - name: depth
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: >
            cast(longitude as string) || '-' ||
            cast(latitude as string) || '-' ||
            soil_property || '-' ||
            depth
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 30

  - name: stg_unccd_land_degradation
    description: "UNCCD land degradation indicators"
    columns:
      - name: unccd_land_degradation_sk
        description: "Surrogate key over business grain"
        tests:
          - unique
          - not_null
      - name: geo_area_code
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 30

  - name: stg_s4a_field_surveys
    description: "S4A field surveys – soil surface"
    columns:
      - name: s4a_field_surveys_sk
        description: "Surrogate key over business grain"
        tests:
          - not_null
      - name: plot_code
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

  - name: stg_cifor_icraf
    description: "CIFOR-ICRAF plot soil nutrients"
    columns:
      - name: cifor_icraf_sk
        description: "Surrogate key over business grain"
        tests:
          - unique
          - not_null
      - name: plot_id
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null
