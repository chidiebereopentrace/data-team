version: 2

models:
  - name: stg_wfp_vampire_prices
    description: "WFP VAMPIRE Global Food Prices – curated for fct_prices"
    columns:
      - name: wfp_vampire_prices_sk
        description: "Surrogate key over business grain"
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: market_name
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values:
                - 'WFP_VAMPIRE_global_food_prices'
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 7
