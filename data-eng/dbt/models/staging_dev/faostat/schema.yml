version: 2

models:
  - name: stg_faostat_production
    description: "FAOSTAT Production – Crops & Livestock + Production Indices + Value of Agricultural Production"
    columns:
      - name: area_code
        tests:
          - not_null
      - name: item_code
        tests:
          - not_null
      - name: element_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Unpivoted_FAOstat_africa_production_Crops_and_livestock'
                - 'Unpivoted_FAOstat_africa_production_Production Indices'
                - 'Unpivoted_FAOstat_africa_production_Value_of_Agricultural_Production'
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: >
            cast(area_code as string) || '-' ||
            cast(item_code as string) || '-' ||
            cast(element_code as string) || '-' ||
            cast(year as string) || '-' ||
            source_natural_key

  - name: stg_faostat_emissions
    description: "FAOSTAT Agrifood Systems Emissions (all farm-gate, land-use, pre/post and totals)"
    columns:
      - name: area_code
        tests:
          - not_null
      - name: item_code
        tests:
          - not_null
      - name: element_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: >
            cast(area_code as string) || '-' ||
            cast(item_code as string) || '-' ||
            cast(element_code as string) || '-' ||
            cast(year as string) || '-' ||
            source_natural_key

      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 14

  - name: stg_faostat_prices
    description: "FAOSTAT Prices – Producer Prices, Consumer Price Indices, Deflators, Exchange Rates"
    columns:
      - name: area_code
        tests:
          - not_null
      - name: element_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Unpivoted_FAOstat_africa_Prices_Producer_Prices'
                - 'Unpivoted_FAOstat_africa_Prices_Consumer_Price_Indices'
                - 'Unpivoted_FAOstat_africa_Prices_Deflators'
                - 'Unpivoted_FAOstat_africa_Prices_Exchange_rates'
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: >
            cast(area_code as string) || '-' ||
            coalesce(cast(item_code as string), '') || '-' ||
            cast(element_code as string) || '-' ||
            coalesce(cast(months_code as string), '') || '-' ||
            coalesce(iso_currency_code, '') || '-' ||
            cast(year as string) || '-' ||
            source_natural_key

      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 14

  - name: stg_faostat_trade
    description: "FAOSTAT Trade – Crops & Livestock Products, Trade Indices, Indicators"
    columns:
      - name: area_code
        tests:
          - not_null
      - name: item_code
        tests:
          - not_null
      - name: element_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Unpivoted_FAOstat_africa_Trade_Crops_and_livestock_products'
                - 'Unpivoted_FAOstat_africa_Trade_Trade_Indices'
                - 'Unpivoted_FAOstat_africa_Trade_Crops_and_livestock_products_indicators'
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: >
            cast(area_code as string) || '-' ||
            cast(item_code as string) || '-' ||
            cast(element_code as string) || '-' ||
            cast(year as string) || '-' ||
            source_natural_key

      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 14

  - name: stg_faostat_food_balances
