version: 2

models:
  - name: stg_fews_food_security
    description: "Lean FEWS Food Security – only columns needed for final schema"
    columns:
      - name: fews_food_security_sk
        description: "Surrogate key over business grain"
        tests:
          - not_null
      - name: fnid
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: measure_type
        tests:
          - not_null
          - accepted_values:
              values: ['population', 'classification']
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values:
                - 'FEWS_NET_Food_insecure_population_estimates'
                - 'FEWS_NET_food_security_classifications'
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 7

  - name: stg_fews_market_prices
    description: "Lean FEWS NET Market Prices"
    columns:
      - name: fews_market_prices_sk
        description: "Surrogate key over business grain"
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: market_name
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values: ['FEWS_NET_market_Prices']
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 7

  - name: stg_fews_data_series_catalogue
    description: "FEWS NET data_series catalogue tables (classifications, population, market prices, cross-border trade)"
    columns:
      - name: fews_data_series_catalogue_sk
        description: "Surrogate key over business grain"
        tests:
          - unique
          - not_null
      - name: id
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: fews_domain
        tests:
          - not_null
          - accepted_values:
              values:
                - 'food_security_classifications'
                - 'population_estimates'
                - 'market_prices'
                - 'cross_border_trade'
      - name: source_natural_key
        tests:
          - not_null
      - name: loaded_at
        tests:
          - not_null

    tests:
      - unique:
          column_name: "cast(id as string) || '-' || source_natural_key"

  - name: stg_fews_cross_border_trade
    description: "Lean FEWS NET Cross Border Trade"
    columns:
      - name: fews_cross_border_trade_sk
        description: "Surrogate key over business grain"
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: source_natural_key
        tests:
          - not_null
          - accepted_values:
              values: ['FEWS_NET_cross_border_Trade']
      - name: loaded_at
        tests:
          - not_null

    tests:
      - dbt_utils.recency:
          datepart: day
          field: loaded_at
          interval: 7
