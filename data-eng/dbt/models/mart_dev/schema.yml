# mart_dev Gold layer (DPL-044)
# dbt run --target mart_dev_sa --select mart_dev.*

version: 2

models:
  - name: dim_geography
    columns:
      - name: geography_key
        tests:
          - not_null
          - unique
      - name: data_level
        tests:
          - not_null
          - accepted_values:
              values: ['national', 'sub_national', 'community', 'point']

  - name: dim_ref_country
    description: "Reference country dimension with in_africa_scope policy"
    columns:
      - name: country_iso3
        tests:
          - not_null
          - unique
      - name: in_africa_scope
        tests:
          - not_null

  - name: dim_faostat_area
    description: "FAOSTAT area_code reference dimension"
    columns:
      - name: faostat_area_key
        tests:
          - not_null
          - unique
      - name: area_code
        tests:
          - not_null
          - unique

  - name: dim_date
