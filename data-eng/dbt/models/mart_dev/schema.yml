          - unique

  - name: dim_season
    columns:
      - name: season_key
        tests:
          - not_null
          - unique

  - name: dim_source
    columns:
      - name: source_key
        tests:
          - not_null
          - unique
      - name: source_natural_key
        tests:
          - not_null
          - unique
      - name: tier
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
              quote: false
      - name: default_data_level
        tests:
          - not_null
          - accepted_values:
              values: ['global', 'national', 'sub_national', 'community', 'point']
      - name: producer_scale
        tests:
          - not_null
          - accepted_values:
              values: ['global', 'regional', 'national', 'subnational']

