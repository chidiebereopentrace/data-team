[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion"
version = "0.1.0"
description = "OpenTrace repo-based BigQuery ingestion into landing_dev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.14.0",
  "google-auth>=2.23.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "requests>=2.31.0",
  "openpyxl>=3.1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-socket>=0.6.0",
  "responses>=0.25.0",
  "ruff>=0.1.0",
]

[project.scripts]
ingestion = "ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["package"]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]
