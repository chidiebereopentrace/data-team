# Domain-grouped staging models for dbt/models/staging_dev/
# Each model reads only source('raw_dev', …). Generator hardcodes raw_dev.
#
# tables: list of raw_dev table ids (1 = passthrough stub; 2+ = CTE + union all stub)
# tables: null or [] => unmapped placeholder until wired
#
# Edit this file and re-run generate_dbt_models_from_catalog.py --staging-only
# (existing SQL files are never overwritten — wipe staging_dev first to regenerate).

models:
  # --- fews (time_series observation grain only) ---
  - path: fews/stg_fews_food_security.sql
    tables:
      - FEWS_NET_Food_insecure_population_estimates_time_series_data
      - FEWS_NET_food_security_classifications_time_series_data
