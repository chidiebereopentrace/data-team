version: '2026.8'
dataset: mart_dev
entity_count: 63
acf_contract:
- column: tier
  meaning: Producer scale (1=global, 2=national ministry, 3=community survey)
  example: '1'
- column: data_level
  meaning: Resolution of the number (warehouse row resolution)
  example: sub_national
- column: place_scope
  meaning: ARRAY of comparable place labels for ACF geo overlap
  example: '[''ETH'',''ETR103'',''Oromia'']'
- column: metric
  meaning: Stable slug for the measure
  example: price_retail_maize
- column: source_id
  meaning: Lineage key (= dim_source.source_key)
  example: faostat_prices_eth
- column: value
  meaning: Numeric measure
  example: '42.5'
- column: unit
  meaning: Unit of measure
  example: ETB/kg
- column: as_of_date
  meaning: Observation date when known; else DATE(loaded_at)
  example: '2024-06-30'
- column: as_of_date_basis
  meaning: observation or loaded_at
  example: observation
- column: geo_scope
  meaning: national / sub_national / community / point (null when geography_key null)
  example: national
- column: geography_key
  meaning: FK to dim_geography (null if unmatched)
  example: geo_eth_country
- column: country_iso3
  meaning: ISO3 from dim or extractable geo even if key null
  example: ETH
- column: source_key
  meaning: FK to dim_source
  example: src_faostat_prod
analytical_recipes:
- recipe_id: sourcing_production
  question: Compare maize production across West African origins over 5 years
  tables: agg_production_country_year, dim_geography, dim_product, dim_source
  filters: production from physical grain via agg; product_name like maize; country_iso3
    in (...); group by source_key
  join_sketch: agg → dim_geography on geography_key → dim_product on product_key →
    dim_source on source_key
  grain_warning: Use agg_production_country_year (FAOSTAT country-year). Do NOT mix
    with fct_yield FNID-season.
  ota_lane: metric + insight
- recipe_id: price_volatility
  question: Retail maize price trends in Ethiopia and Kenya this season
  tables: agg_prices_country_month or fct_prices, dim_geography, dim_product, dim_market
  filters: year/month window; price_type; country_iso3; product; always keep source_key
  join_sketch: prices → geography_key → product_key → market_key (fact only)
  grain_warning: Month must be calendar 1-12. Prefer agg for country rollup; fct_prices
    for market detail.
  ota_lane: metric + recommendation
- recipe_id: climate_vs_yield
  question: Climate stress vs seasonal yield in East Africa
  tables: fct_climate, fct_yield or agg_production_country_season, dim_geography,
    dim_season
  filters: climate_grain; vegetation/climate as_of_date window; yield by harvest_year/season_key
  join_sketch: Align on country_iso3 + year; never average fct_yield with fct_production
  grain_warning: fct_climate has point_obs vs country_model grains. Filter climate_grain
    before charts.
  ota_lane: insight + metric
- recipe_id: food_security_ew
  question: Districts with elevated IPC phase / population in phase 3+
  tables: fct_food_security or agg_food_security_country_month, dim_classification,
    dim_geography
  filters: measure_type=classification|population; scenario; year/month
  join_sketch: food_security → classification_key → geography_key
  grain_warning: pct_phase3/4/5 typically on population product only — null on classification
    is expected.
  ota_lane: insight + recommendation
- recipe_id: trade_flows
  question: Cross-border rice trade flows in West Africa
  tables: fct_trade, dim_geography, dim_product or dim_item, dim_source
  filters: trade_grain = fews_border_month or faostat_country_year; product/item filter
  join_sketch: fct_trade → geography_key; use source/destination country cols for
    FEWS borders
  grain_warning: Filter trade_grain before analysis. Do not blend FEWS border with
    FAOSTAT country-year silently.
  ota_lane: metric + insight
entities:
- table_name: dim_geography
  layer: dim
  domain: geography
  grain: One row per place (country, admin, city, FNID, point)
  primary_key: geography_key
  purpose: Conformed place spine for all geo-aware facts.
  analytical_use: Join every fact on geography_key; filter geo_level / data_level
    / country_iso3.
  join_keys: geography_key; country_key; parent_geography_key
  grain_filters: geo_level, data_level
  source_lineage: int_geography_conformed ← stg_geo + FAOSTAT/FEWS spines
  ota_report_use: Always attribute place in insight/metric text; prefer country_iso3
    + place_scope.
  caveats: Country grain may lack country_iso3 on some spines (see MART_QA_NOTES HDI
    history).
- table_name: dim_ref_country
  layer: dim
  domain: geography
  grain: One row per ISO3 country
  primary_key: country_iso3
  purpose: Reference country attributes including Africa scope policy.
  analytical_use: Filter in_africa_scope for continental OTA briefs.
  join_keys: country_iso3
  grain_filters: in_africa_scope
  source_lineage: ref_m49 / country reference seeds
  ota_report_use: Scope Africa-only vs global partner lists.
  caveats: Not a substitute for dim_geography joins on facts.
- table_name: dim_faostat_area
  layer: dim
  domain: geography
  grain: One row per FAOSTAT area_code
  primary_key: faostat_area_key
  purpose: FAOSTAT area code reference mapped toward ISO/M49.
  analytical_use: Debug FAOSTAT geo matching; map area_code ↔ country.
  join_keys: faostat_area_key, area_code
  grain_filters: ''
  source_lineage: int_faostat_area_iso / area reference
  ota_report_use: Rarely cited directly; use for lineage footnotes.
  caveats: Some area codes remain unmapped to ISO3.
- table_name: dim_date
  layer: dim
  domain: calendar
  grain: One row per calendar day
  primary_key: date_key
  purpose: Calendar spine (year/month/quarter helpers).
  analytical_use: Join facts on date_key for time series charts.
  join_keys: date_key
  grain_filters: year, month, quarter
  source_lineage: generated spine
  ota_report_use: Standardise as-of language in metrics.
  caveats: Prefer filtering fact as_of_date for partition pruning.
- table_name: dim_season
  layer: dim
  domain: production
  grain: Country × season_name
  primary_key: season_key
  purpose: Agricultural seasons by country (start/end months).
  analytical_use: Join fct_yield / seasonal aggs; never mix with FAOSTAT year alone.
  join_keys: season_key
  grain_filters: ''
  source_lineage: season reference / yield intermediates
  ota_report_use: Seasonal sourcing and planting window narratives.
  caveats: Season grain ≠ FAOSTAT calendar year.
- table_name: dim_source
  layer: dim
  domain: lineage
  grain: One row per source_natural_key
  primary_key: source_key
  purpose: Source registry for ACF tier and producer scale.
  analytical_use: Always group/filter by source_key — no silent source blend.
  join_keys: source_key, source_natural_key
  grain_filters: tier, producer_scale
  source_lineage: int_source_registry
  ota_report_use: Cite source in every OTA metric footnote.
  caveats: Aggregates must retain source_key.
- table_name: dim_product
  layer: dim
  domain: production
  grain: Crop/commodity product identity
  primary_key: product_key
  purpose: Product dimension for production, prices, food balance, trade.
  analytical_use: Prefer over dim_item for crop/commodity charts.
  join_keys: product_key
  grain_filters: ''
  source_lineage: production/prices/food balance unions
  ota_report_use: Name commodities consistently in OTA titles.
  caveats: dim_item is for FAOSTAT long-form item codes on other facts.
- table_name: dim_item
  layer: dim
  domain: reference
  grain: FAOSTAT-style item name/code
  primary_key: item_key
  purpose: Items for emissions, employment, land inputs, investment, etc.
  analytical_use: Join long FAOSTAT facts that use item_key.
  join_keys: item_key
  grain_filters: ''
  source_lineage: multi-domain FAOSTAT intermediates
  ota_report_use: Label non-crop FAOSTAT series.
  caveats: Do not confuse with dim_product.
- table_name: dim_element
  layer: dim
  domain: reference
  grain: FAOSTAT-style element
  primary_key: element_key
  purpose: Element labels (production qty, area harvested, imports, …).
  analytical_use: Filter long-form facts by element before pivoting.
  join_keys: element_key
  grain_filters: ''
  source_lineage: multi-domain FAOSTAT intermediates
  ota_report_use: Clarify which measure an OTA metric uses.
  caveats: Food balance convenience columns map by element_code, not English labels
    alone.
- table_name: dim_unit
  layer: dim
  domain: reference
  grain: Unit code × type
  primary_key: unit_key
  purpose: Quantity and currency units.
  analytical_use: Join prices/production unit keys; never invent units.
  join_keys: unit_key
  grain_filters: unit_type
  source_lineage: prices/production + standard ha/t/ha
  ota_report_use: Always publish units beside metric values.
  caveats: WFP common_unit_price may be null — expected.
