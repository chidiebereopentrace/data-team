column_overrides:
  fct_production:
    production_key:
      role: PK
      description: Surrogate production fact key
      data_type: STRING
    production_grain:
      role: dim
      description: physical | index | gross_value
      example: physical
    area_harvested:
      role: measure
      description: Area harvested when element matches
      data_type: FLOAT64
    production_qty:
      role: measure
      description: Production quantity when element matches
      data_type: FLOAT64
    yield_value:
      role: measure
      description: Yield when element matches (FAOSTAT)
      data_type: FLOAT64
    product_key:
      role: FK
      description: FK → dim_product
    element_key:
      role: FK
      description: FK → dim_element
  fct_yield:
    yield_key:
      role: PK
      description: Surrogate yield fact key
    area_harvested:
      role: measure
      description: Area harvested (ha default unit)
    production_qty:
      role: measure
      description: Production quantity (tonnes default)
    yield_value:
      role: measure
      description: Yield (t/ha default)
    season_key:
      role: FK
      description: FK → dim_season
  fct_prices:
    price_key:
      role: PK
      description: Surrogate price fact key
    market_key:
      role: FK
      description: FK → dim_market
    product_key:
      role: FK
      description: FK → dim_product
    unit_key:
      role: FK
      description: FK → dim_unit
    month:
      role: dim
      description: Calendar month 1-12 (null if unknown)
  fct_trade:
    trade_key:
      role: PK
      description: Surrogate trade fact key
    trade_grain:
      role: dim
      description: faostat_country_year | fews_border_month
    source_country:
      role: dim
      description: FEWS origin country label
    destination_country:
      role: dim
      description: FEWS destination country label
    border_point:
      role: dim
      description: FEWS border point
    trade_flow:
      role: dim
      description: Trade flow direction/type
  fct_food_security:
    food_security_key:
      role: PK
      description: Surrogate food security key
    measure_type:
      role: dim
      description: classification | population | …
    classification_key:
      role: FK
      description: FK → dim_classification
  fct_climate:
    climate_key:
      role: PK
      description: Surrogate climate key
    climate_grain:
      role: dim
      description: point_obs | country_model
    indicator_key:
      role: FK
      description: FK → dim_indicator
  dim_geography:
    geography_key:
      role: PK
      description: Surrogate geography key
    geo_level:
      role: dim
      description: country | admin | city | fnid | point | …
    data_level:
      role: dim
      description: national | sub_national | community | point
    country_iso3:
      role: dim
      description: ISO3 when known
    parent_geography_key:
      role: FK
      description: One-hop parent place
  dim_source:
    source_key:
      role: PK
      description: Surrogate source key
    source_natural_key:
      role: dim
      description: Stable natural lineage key
    tier:
      role: acf
      description: Default ACF tier 1/2/3
acf_column_defaults:
  tier:
    role: acf
    description: ACF producer-scale tier 1/2/3
    example: '1'
  data_level:
    role: acf
    description: Warehouse data resolution
    example: national
  place_scope:
    role: acf
    description: Place labels for ACF overlap
    example: '[''NGA'']'
  metric:
    role: acf
    description: Stable metric slug
    example: production_qty
  source_id:
    role: acf
    description: ACF source id (= source_key)
    example: faostat_prod
  as_of_date:
    role: acf
    description: Observation or pipeline date
    example: '2023-01-01'
  as_of_date_basis:
    role: acf
    description: observation | loaded_at
    example: observation
  geo_scope:
    role: acf
    description: Geo scope band (null if no geography_key)
    example: national
  geography_key:
    role: FK
    description: FK → dim_geography
    example: …
  country_iso3:
    role: dim
    description: ISO3 country code
    example: ETH
  source_key:
    role: FK
    description: FK → dim_source
    example: …
  source_natural_key:
    role: dim
    description: Natural source lineage key
    example: faostat_crops
  loaded_at:
    role: meta
    description: Pipeline load timestamp
    example: '2026-08-01'
  date_key:
    role: FK
    description: FK → dim_date
    example: '20230101'
  value:
    role: measure
    description: Primary numeric measure
    example: '1000'
  unit:
    role: measure
    description: Unit of value
    example: tonnes
