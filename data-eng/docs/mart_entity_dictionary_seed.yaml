  analytical_use: Filter trade_grain before charts; use partner/border columns for
    FEWS.
  join_keys: geography_key, product_key, item_key, element_key, source_key, date_key
  grain_filters: trade_grain
  source_lineage: FAOSTAT trade + FEWS cross-border intermediates
  ota_report_use: Trade flow and border market OTAs.
  caveats: Do not blend trade grains or forestry trade into this fact.
