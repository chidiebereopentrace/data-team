<title>Continental OTA Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control rail across the top, then a map-and-panel explorer. Same selection drives map colour and the detail panel; other tabs are the full lists behind it. */
:root{
  --bg:#F7F1DE; --surface:#FFFCF3; --sunk:#EFE7CF; --ink:#13241A; --muted:#5B6A5E; --line:#E0D7BC;
  --accent:#0B5132; --on-accent:#F7F1DE; --leaf:#5DA959; --sky:#88B9E8;
  --sF:#1F7A45; --sP:#9ACB6E; --sR:#6FA6DC; --sG:#D9614F; --sN:#DCD3B8; --sea:#EAF1F3;
  --warn:#A65E12; --warn-bg:#F6E3C6;
  --display:"Fraunces",Georgia,serif; --body:"Outfit","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1712; --surface:#14221A; --sunk:#101C15; --ink:#ECE5D0; --muted:#9AA99C; --line:#243629;
  --accent:#86C98F; --on-accent:#0D1712; --leaf:#6DB868; --sky:#88B9E8;
  --sF:#3FA866; --sP:#A9D47E; --sR:#6FA6DC; --sG:#E2725F; --sN:#2C3B30; --sea:#0F1C18;
  --warn:#E3A35C; --warn-bg:#3A2A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1712; --surface:#14221A; --sunk:#101C15; --ink:#ECE5D0; --muted:#9AA99C; --line:#243629;
  --accent:#86C98F; --on-accent:#0D1712; --leaf:#6DB868; --sky:#88B9E8;
  --sF:#3FA866; --sP:#A9D47E; --sR:#6FA6DC; --sG:#E2725F; --sN:#2C3B30; --sea:#0F1C18;
  --warn:#E3A35C; --warn-bg:#3A2A14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,38px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:italic;color:var(--leaf);font-weight:500}
.example{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;max-width:560px}
.example b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.controls{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:end}
@media (max-width:900px){.controls{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.controls{grid-template-columns:1fr}}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ctl select,.ctl input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}
/* explorer */
.explorer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:1000px){.explorer{grid-template-columns:1fr}}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px}
@media (max-width:1000px){.mapcard{position:static}}
.mapcard svg{width:100%;height:auto;display:block}
.mapcard path{stroke:var(--surface);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.mapcard path.esh{fill:var(--sN);cursor:default;opacity:.6}
.mapcard path.dim{opacity:.35}
.mapcard path.sel,.mapcard circle.sel{stroke:var(--ink);stroke-width:1.8}
.mapcard circle{stroke:var(--surface);stroke-width:.8;cursor:pointer}
.maptitle{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:2px 4px 8px;flex-wrap:wrap}
.maptitle b{font-family:var(--display);font-weight:600;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ramp{height:10px;border-radius:4px;flex:1;min-width:120px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12.5px;z-index:40;max-width:260px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.card h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.added{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.prov{background:transparent;border:1px dashed var(--line)}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.dist i{display:block;height:100%}
.distlab{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.distlab b{color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.bar:hover{background:var(--sunk)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) 44px}.bar .dist{grid-column:1/-1;order:3}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0;cursor:pointer;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cropgrid{display:flex;flex-direction:column;gap:12px}
.cgroup h4{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.cgroup h4 span{color:var(--muted);font-weight:400}
.cchips{display:flex;flex-wrap:wrap;gap:5px}
.cc{font-size:12px;padding:3px 9px 3px 7px;border-radius:6px;background:var(--sunk);border:0;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.cc i{width:8px;height:8px;border-radius:2px;flex:none}
.cc.on{outline:2px solid var(--accent)}
.note{font-size:12.5px;color:var(--muted)}
.scroll{max-height:520px;overflow:auto}
.cat{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cat summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,240px) 50px;gap:12px;align-items:center}
.cat summary::-webkit-details-marker{display:none}
.cat summary b{font-family:var(--display);font-weight:600;font-size:16px}
.cat summary .c{font-size:12px;color:var(--muted)}
@media (max-width:620px){.cat summary{grid-template-columns:1fr 50px}.cat summary .dist{grid-column:1/-1}}
.cat .tw{border:0;border-top:1px solid var(--line);border-radius:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.heat{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.heat table{border-collapse:separate;border-spacing:2px;width:auto}
.heat th,.heat td{border:0;padding:0;font-size:11px}
.heat th.rot{height:96px;vertical-align:bottom;background:none;position:sticky;top:0;background:var(--surface)}
.heat th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;white-space:nowrap;font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.heat td.h{width:24px;height:22px;border-radius:3px;cursor:pointer}
.heat td.lab{padding:0 10px 0 6px;white-space:nowrap;font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:1}
.heat th.rg{font-size:10px;text-align:center;background:var(--surface);color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">OpenTrace Africa · OFIA coverage</div>
      <h1>Continental <em>OTA</em> Dashboard</h1>
    </div>
    <div class="example"><b>Warehouse coverage.</b> Green means the cell is in the mart, amber means it has only landed, and red means neither side has a value.</div>
  </header>

  <section class="kpis" id="kpis" aria-label="Catalogue at a glance"></section>

  <section class="controls" aria-label="Selection">
    <div class="ctl"><label for="selCat">Main category</label><select id="selCat"></select></div>
    <div class="ctl"><label for="selInd">Sub-indicator</label><select id="selInd"></select></div>
    <div class="ctl"><label for="selCountry">Country</label><select id="selCountry"></select></div>
    <div class="ctl"><label for="selCrop">Crop or value chain</label><select id="selCrop"></select></div>
  </section>
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <div class="chips" id="regions" aria-label="Region"></div>
      <button class="btn" id="reset" type="button">Reset selection</button>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="explore" type="button">Explorer</button>
      <button role="tab" data-t="catalogue" type="button">Indicator catalogue</button>
      <button role="tab" data-t="crops" type="button">Crops &amp; value chains</button>
      <button role="tab" data-t="countries" type="button">Countries</button>
      <button role="tab" data-t="matrix" type="button">Gap matrix</button>
    </div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <main id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="D">__DATA__</script>
<script type="application/json" id="G">__GEO__</script>
<script>
const D=JSON.parse(document.getElementById('D').textContent), G=JSON.parse(document.getElementById('G').textContent);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CI=Object.fromEntries(D.countries.map((c,i)=>[c.iso,i])), CBY=Object.fromEntries(D.countries.map(c=>[c.iso,c]));
const IND=Object.fromEntries(D.inds.map(i=>[i.id,i])), CAT=Object.fromEntries(D.cats.map(c=>[c.code,c]));
const CROP=Object.fromEntries(D.crops.map(c=>[c.k,c])), CIX=Object.fromEntries(D.cropInds.map((id,i)=>[id,i]));
const LV='Livestock & fisheries';
const SL={F:'Federated',P:'Partial',R:'Reconstructed',G:'Gap','-':'Not applicable',N:'Not grown'};
const SC={F:'var(--sF)',P:'var(--sP)',R:'var(--sR)',G:'var(--sG)','-':'var(--sN)',N:'var(--sN)'};
const REG=['North','West','Central','East','Southern'];
let S={cat:'',ind:'',iso:'',crop:'',region:'',tab:'explore',sort:null};
try{const v=JSON.parse(localStorage.getItem('ota-dash')||'null');if(v)Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem('ota-dash',JSON.stringify(S))}catch(e){}};
const pct=x=>Math.round(x*100)+'%', fmt=n=>n.toLocaleString('en-GB');

/* ---------- data helpers ---------- */
const stCountry=(id,iso)=>D.cov[id][CI[iso]];
const meta=(id,iso)=>D.covmeta[id][CI[iso]];
const indsOf=cat=>D.inds.filter(i=>i.cat===cat);
function cropRow(iso,k){const l=D.ccrops[iso];for(let r=0;r<l.length;r++)if(l[r][0]===k)return r;return -1}
const countAt=(id,iso)=>(D.covcount[id]||[])[CI[iso]]||0;
const passagesAt=(id,iso)=>(D.passagecount[id]||[])[CI[iso]]||0;
function cropDatapoints(iso,k,id){const r=cropRow(iso,k);if(r<0||!D.cropn||!D.cropn[iso])return 0;return (D.cropn[iso][r]||[])[CIX[id]]||0}
function stCrop(id,iso,k){const r=cropRow(iso,k);if(r<0)return 'N';return D.cropcov[iso][r][CIX[id]]}
function share(arr){const n={F:0,P:0,R:0,G:0};arr.forEach(s=>{if(n[s]!=null)n[s]++});const t=n.F+n.P+n.R+n.G;return {...n,t,cov:t?(n.F+n.P)/t:0}}
function countryIndShare(iso,list){return share(list.map(i=>stCountry(i.id,iso)))}
function countryCommShare(iso,filterInd){
  const rows=D.cropcov[iso],arr=[];
  rows.forEach(r=>{if(filterInd){arr.push(r[CIX[filterInd]])}else for(const ch of r)arr.push(ch)});
  return share(arr)}
function cropShareIn(iso,k){const r=cropRow(iso,k);if(r<0)return null;return share([...D.cropcov[iso][r]])}
const isCommodityInd=id=>id&&IND[id]&&IND[id].level!=='Country';
const cropsByCountry=k=>D.countries.filter(c=>cropRow(c.iso,k)>=0);
const inRegion=c=>!S.region||c.region===S.region;

/* ---------- KPIs ---------- */
(function(){
  const cat=D.inds.filter(i=>i.origin==='Catalogue').length, add=D.inds.length-cat;
  const crops=D.crops.filter(c=>c.cat!==LV).length, vc=D.crops.length-crops;
  const entries=D.countries.reduce((a,c)=>a+c.nCrops,0);
  const all=share(D.inds.flatMap(i=>[...D.cov[i.id]]));
  $('#kpis').innerHTML=[[fmt(D.datapoints),'Datapoints'],[fmt(D.passages),'Knowledge passages'],[pct(all.cov),'Catalogue coverage'],[54,'Countries'],
    [D.cats.length,'Main categories'],[D.inds.length,`Sub-indicators (${cat} catalogue, ${add} added)`],
    [crops,`Crops (${fmt(entries)} country entries)`],[vc,'Livestock and fish value chains']]
    .map(([v,l])=>`<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
})();

/* ---------- controls ---------- */
function fillControls(){
  $('#selCat').innerHTML='<option value="">All categories</option>'+D.cats.map(c=>`<option value="${c.code}" ${c.code===S.cat?'selected':''}>${esc(c.name)}${c.added?' (added)':''}</option>`).join('');
  const li=S.cat?indsOf(S.cat):D.inds;
  $('#selInd').innerHTML=`<option value="">${S.cat?'All in this category':'All sub-indicators'} (${li.length})</option>`+
    (S.cat?li:D.cats.flatMap(c=>indsOf(c.code))).map(i=>`<option value="${i.id}" ${i.id===S.ind?'selected':''}>${esc(i.id)} · ${esc(i.name)}${i.origin==='Added'?' · added':''}</option>`).join('');
  const cs=D.countries.filter(inRegion);
  $('#selCountry').innerHTML='<option value="">All of Africa'+(S.region?' · '+S.region:'')+'</option>'+REG.filter(r=>!S.region||r===S.region).map(r=>`<optgroup label="${r}">`+cs.filter(c=>c.region===r).map(c=>`<option value="${c.iso}" ${c.iso===S.iso?'selected':''}>${esc(c.name)}</option>`).join('')+'</optgroup>').join('');
  let pool=S.iso?D.ccrops[S.iso].map(r=>CROP[r[0]]):D.crops;
  const cats=[...new Set(pool.map(c=>c.cat))].sort((a,b)=>(a===LV)-(b===LV)||a.localeCompare(b));
  $('#selCrop').innerHTML=`<option value="">${S.iso?'All '+pool.length+' in '+esc(CBY[S.iso].name):'All crops and value chains ('+pool.length+')'}</option>`+cats.map(ct=>`<optgroup label="${esc(ct)}">`+
    pool.filter(c=>c.cat===ct).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.k}" ${c.k===S.crop?'selected':''}>${esc(c.name)}</option>`).join('')+'</optgroup>').join('');
  $('#regions').innerHTML=['',...REG].map(r=>`<button class="chip" type="button" data-r="${r}" aria-pressed="${S.region===r}">${r||'All regions'}</button>`).join('');
  document.querySelectorAll('#regions .chip').forEach(b=>b.onclick=()=>{S.region=b.dataset.r;if(S.iso&&CBY[S.iso].region!==S.region&&S.region)S.iso='';go()});
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===S.tab));
}
$('#selCat').onchange=e=>{S.cat=e.target.value;if(S.ind&&IND[S.ind].cat!==S.cat)S.ind='';go()};
$('#selInd').onchange=e=>{S.ind=e.target.value;if(S.ind)S.cat=IND[S.ind].cat;go()};
$('#selCountry').onchange=e=>{S.iso=e.target.value;if(S.crop&&S.iso&&cropRow(S.iso,S.crop)<0)S.crop='';go()};
$('#selCrop').onchange=e=>{S.crop=e.target.value;go()};
$('#reset').onclick=()=>{S={...S,cat:'',ind:'',iso:'',crop:'',region:''};go()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;go()});
function setSel(p){Object.assign(S,p);if(p.ind)S.cat=IND[p.ind].cat;if(S.iso&&S.crop&&cropRow(S.iso,S.crop)<0&&!('crop'in p))S.crop='';go()}

/* ---------- map ---------- */
function mapValue(iso){
  // returns {kind:'status',s} or {kind:'share',v} or null
  if(S.crop){
    if(cropRow(iso,S.crop)<0)return {kind:'status',s:'N'};
    if(S.ind&&isCommodityInd(S.ind))return {kind:'status',s:stCrop(S.ind,iso,S.crop)};
    if(!S.ind)return {kind:'share',v:cropShareIn(iso,S.crop).cov};
  }
  if(S.ind)return {kind:'status',s:stCountry(S.ind,iso)};
  const list=S.cat?indsOf(S.cat):D.inds;
  return {kind:'share',v:countryIndShare(iso,list).cov};
}
function ramp(v){ // 0..1 -> mix gap red > amber > green
  const stops=[[0,[217,97,79]],[.5,[232,196,110]],[1,[31,122,69]]];
  let a=stops[0],b=stops[2];for(let i=0;i<2;i++)if(v>=stops[i][0]&&v<=stops[i+1][0]){a=stops[i];b=stops[i+1]}
  const t=(v-a[0])/((b[0]-a[0])||1);return `rgb(${a[1].map((x,i)=>Math.round(x+(b[1][i]-x)*t)).join(',')})`}
function mapHTML(){
  let paths='',dots='';
  for(const [iso,d] of Object.entries(G.paths)){
    if(iso==='ESH'){paths+=`<path class="esh" d="${d}"><title>Western Sahara (not in the 54)</title></path>`;continue}
    const c=CBY[iso],mv=mapValue(iso),fill=mv.kind==='status'?SC[mv.s]:ramp(mv.v);
    const dim=!inRegion(c)?' dim':'', sel=iso===S.iso?' sel':'';
    paths+=`<path data-iso="${iso}" class="${dim}${sel}" style="fill:${fill}" d="${d}"></path>`;
    const ct=G.cent[iso];
    if(ct&&ct[2]<60)dots+=`<circle data-iso="${iso}" class="${dim}${sel}" cx="${ct[0]}" cy="${ct[1]}" r="6" style="fill:${fill}"></circle>`;
  }
  return `<svg viewBox="0 0 600 640" role="img" aria-label="Map of Africa coloured by the current selection"><rect width="600" height="640" fill="var(--sea)" rx="10"></rect>${paths}${dots}</svg>`;
}
function mapTitle(){
  if(S.crop&&S.ind&&isCommodityInd(S.ind))return [`${CROP[S.crop].name}: ${IND[S.ind].name}`,'Status for this crop in each country that grows it'];
  if(S.crop&&S.ind)return [IND[S.ind].name,`Country-level indicator. ${CROP[S.crop].name} does not change it.`];
  if(S.crop)return [CROP[S.crop].name,'Catalogue coverage for this crop, in countries that list it'];
  if(S.ind)return [IND[S.ind].name,'Status by country'];

  return ['All indicators','Catalogue coverage (federated or partial)'];

/* ---------- shared fragments ---------- */
const stHTML=s=>`<span class="st"><i style="background:${SC[s]}"></i>${SL[s]}</span>`;
function distHTML(sh,showLab=true){
  const t=sh.t||1;
  return `<div class="dist">${['F','P','R','G'].map(k=>sh[k]?`<i style="width:${sh[k]/t*100}%;background:${SC[k]}"></i>`:'').join('')}</div>`+
   (showLab?`<div class="distlab">${['F','P','R','G'].map(k=>`<span><b>${sh[k]}</b> ${SL[k].toLowerCase()}</span>`).join('')}</div>`:'')}
function indTags(i){return `<div class="meta"><span class="tag mono">${i.id}</span><span class="tag">${esc(CAT[i.cat].name)}</span><span class="tag">${i.level}-level</span><span class="tag">${esc(i.unit)}</span><span class="tag">${i.freq}</span><span class="tag">${i.gran}</span>${i.origin==='Added'?'<span class="tag added">Added, not in sheet</span>':`<span class="tag prov">From tab: ${esc(i.tab)}</span>`}${i.also&&i.also.length?`<span class="tag">Also listed as ${i.also.join(', ')}</span>`:''}</div>`}
function sortable(tbl,rows,cols,onRow){
  // cols: [{h, v:(row)=>sortValue, html:(row)=>cell, n:bool}]
  let key=null,dir=1;
  const draw=()=>{const rs=[...rows];if(key!=null)rs.sort((a,b)=>{const x=cols[key].v(a),y=cols[key].v(b);return (x>y?1:x<y?-1:0)*dir});
    tbl.innerHTML=`<thead><tr>${cols.map((c,i)=>`<th data-i="${i}" scope="col">${esc(c.h)}${key===i?(dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${rs.map((r,ri)=>`<tr class="${onRow?'click':''}" data-r="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.n?'n':''}">${c.html(r)}</td>`).join('')}</tr>`).join('')}</tbody>`;
    tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;dir=key===i?-dir:1;key=i;draw()});
    if(onRow)tbl.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>onRow(rows[+tr.dataset.r]));};
  draw();
}
function cropGroups(iso,colorFor,only){
  const rows=D.ccrops[iso],groups={};
  rows.forEach((r,ri)=>{if(only&&!only(r))return;(groups[r[3]]=groups[r[3]]||[]).push([r,ri])});
  const order=Object.keys(groups).sort((a,b)=>(a===LV)-(b===LV)||groups[b].length-groups[a].length);
  return `<div class="cropgrid">${order.map(g=>`<div class="cgroup"><h4>${esc(g)} <span>${groups[g].length}</span></h4><div class="cchips">${groups[g].map(([r,ri])=>{
    const col=colorFor(r,ri);return `<button type="button" class="cc ${r[0]===S.crop?'on':''}" data-k="${r[0]}" title="${esc(r[1])}"><i style="background:${col}"></i>${esc(CROP[r[0]].name)}</button>`}).join('')}</div></div>`).join('')}</div>`;
}

function panelHTML(){
  const parts=[];
  if(S.iso){
    const c=CBY[S.iso],list=S.cat?indsOf(S.cat):D.inds,sh=countryIndShare(S.iso,list),csh=countryCommShare(S.iso);
    parts.push(`<section class="card"><div class="meta"><span class="tag">${c.region} Africa</span>${c.priority?'<span class="tag added" style="background:var(--sunk);color:var(--accent)">Priority market</span>':''}</div>
      <h2>${esc(c.name)}</h2>
      <div class="distlab"><span><b>${c.nCrops}</b> crops</span><span><b>${c.nLive}</b> livestock and fish value chains</span><span><b>${pct(sh.cov)}</b> ${S.cat?esc(CAT[S.cat].name).toLowerCase()+' ':''}catalogue coverage</span><span><b>${pct(csh.cov)}</b> crop and value-chain coverage</span></div>
      ${distHTML(sh)}</section>`);
    if(S.ind){
      const i=IND[S.ind],s=stCountry(i.id,S.iso),m=meta(i.id,S.iso);
      const shown=S.crop&&isCommodityInd(i.id)?cropDatapoints(S.iso,S.crop,i.id):countAt(i.id,S.iso);
      let body=`<h3>Selected sub-indicator</h3><h2>${esc(i.name)}</h2>${indTags(i)}<div class="distlab"><span>National status ${stHTML(s)}</span>${m[0]?`<span>Series from <b>${m[0]}</b></span><span><b>${fmt(shown)}</b> datapoints</span><span><b>${fmt(passagesAt(i.id,S.iso))}</b> knowledge passages</span><span>ACF confidence <b>${m[2]}</b>/100</span>`:'<span>No series</span>'}</div>`;
      if(isCommodityInd(i.id)){
        const sh2=countryCommShare(S.iso,i.id);
        body+=`<h3>By ${i.level==='Crop'?'crop':'value chain'} in ${esc(c.name)}</h3>${distHTML(sh2)}${cropGroups(S.iso,(r,ri)=>SC[D.cropcov[S.iso][ri][CIX[i.id]]],r=>(r[3]===LV)===(i.level==='Value chain'))}`;
      }
      parts.push(`<section class="card">${body}</section>`);
    }else{
      const cats=S.cat?[CAT[S.cat]]:D.cats;
      if(!S.cat)parts.push(`<section class="card"><h3>Coverage by main category</h3><div class="bars">${cats.map(ct=>{const s2=countryIndShare(S.iso,indsOf(ct.code));
        return `<div class="bar" data-cat="${ct.code}"><span class="nm">${esc(ct.name)}${ct.added?' *':''}</span>${distHTML(s2,false)}<span class="v">${pct(s2.cov)}</span></div>`}).join('')}</div><div class="note">* Category added to fill a gap in the catalogue.</div></section>`);
      else parts.push(`<section class="card"><h3>${esc(CAT[S.cat].name)} in ${esc(c.name)}</h3><div class="tw scroll"><table id="t1"></table></div></section>`);
    }
    if(S.crop&&!S.ind){
      const r=cropRow(S.iso,S.crop),row=D.cropcov[S.iso][r];
      parts.push(`<section class="card"><h3>${esc(CROP[S.crop].name)} in ${esc(c.name)}</h3><div class="note">Listed as “${esc(D.ccrops[S.iso][r][1])}”${D.ccrops[S.iso][r][2]?' under '+esc(D.ccrops[S.iso][r][2]):''}.</div>${distHTML(share([...row]))}<div class="tw scroll"><table id="t2"></table></div></section>`);
    }
    if(!S.ind)parts.push(`<section class="card"><h3>All ${D.ccrops[S.iso].length} crops and value chains · colour = crop-level coverage</h3>${cropGroups(S.iso,(r,ri)=>ramp(share([...D.cropcov[S.iso][ri]]).cov))}</section>`);
  }else if(S.ind){
    const i=IND[S.ind],cs=D.countries.filter(inRegion),sh=share(cs.map(c=>stCountry(i.id,c.iso)));
    parts.push(`<section class="card"><h3>Sub-indicator</h3><h2>${esc(i.name)}</h2>${indTags(i)}<div class="note">Typical sources: ${esc(CAT[i.cat].source)}.</div>${distHTML(sh)}</section>`);
    parts.push(`<section class="card"><h3>${S.crop?esc(CROP[S.crop].name)+' · ':''}Countries${S.region?' in '+S.region+' Africa':''}</h3><div class="tw scroll"><table id="t3"></table></div></section>`);
  }else if(S.crop){
    const k=S.crop,cs=cropsByCountry(k).filter(inRegion);
    parts.push(`<section class="card"><h3>${esc(CROP[k].cat)}</h3><h2>${esc(CROP[k].name)}</h2><div class="distlab"><span>Listed in <b>${cs.length}</b> countries${S.region?' in '+S.region+' Africa':''}</span><span>Tier <b>${CROP[k].tier}</b> (1 major, 3 minor)</span></div>${distHTML(share(cs.flatMap(c=>[...D.cropcov[c.iso][cropRow(c.iso,k)]])))}</section>`);
    parts.push(`<section class="card"><h3>Countries listing ${esc(CROP[k].name)}</h3><div class="tw scroll"><table id="t4"></table></div></section>`);
  }else{
    const cs=D.countries.filter(inRegion);
    const cats=S.cat?[CAT[S.cat]]:D.cats;
    parts.push(`<section class="card"><h3>${S.cat?'Sub-indicators in '+esc(CAT[S.cat].name):'Coverage by main category'}${S.region?' · '+S.region+' Africa':' · all 54 countries'}</h3><div class="bars">${
      (S.cat?indsOf(S.cat).map(i=>({k:'ind',id:i.id,nm:i.name,added:i.origin==='Added',sh:share(cs.map(c=>stCountry(i.id,c.iso)))})):
       cats.map(ct=>({k:'cat',id:ct.code,nm:ct.name,added:ct.added,sh:share(cs.flatMap(c=>indsOf(ct.code).map(i=>stCountry(i.id,c.iso))))})))
      .map(x=>`<div class="bar" data-${x.k}="${x.id}" title="${esc(x.nm)}"><span class="nm">${esc(x.nm)}${x.added?' *':''}</span>${distHTML(x.sh,false)}<span class="v">${pct(x.sh.cov)}</span></div>`).join('')}</div>
      <div class="legend" style="padding:0">${['F','P','R','G'].map(k=>`<span><i style="background:${SC[k]}"></i>${SL[k]}</span>`).join('')}<span>* added to the catalogue</span></div></section>`);
    const worst=D.inds.map(i=>({i,sh:share(cs.map(c=>stCountry(i.id,c.iso)))})).sort((a,b)=>b.sh.G-a.sh.G).slice(0,10);
    parts.push(`<section class="card"><h3>Biggest gaps${S.region?' in '+S.region+' Africa':''} · sub-indicators with the most countries missing</h3><div class="bars">${worst.map(x=>`<div class="bar" data-ind="${x.i.id}" title="${esc(x.i.name)}"><span class="nm">${esc(x.i.name)}</span>${distHTML(x.sh,false)}<span class="v">${x.sh.G} gaps</span></div>`).join('')}</div>
      <div class="note">Pick a category, sub-indicator, country or crop above, or click the map, to drill in.</div></section>`);
  }
  return parts.join('');
}

/* ---------- render ---------- */
function crumbs(){
  const b=[];if(S.cat)b.push(CAT[S.cat].name);if(S.ind)b.push(S.ind);if(S.iso)b.push(CBY[S.iso].name);else if(S.region)b.push(S.region+' Africa');if(S.crop)b.push(CROP[S.crop].name);
  $('#crumbs').innerHTML=b.length?'Showing <b>'+b.map(esc).join('</b> · <b>')+'</b>':'Showing <b>all indicators</b> across <b>all 54 countries</b>';
}
function go(){
  save();fillControls();crumbs();
  const m=$('#main');
  if(S.tab==='explore'){
    const [t,sub]=mapTitle();
    m.innerHTML=`<div class="explorer"><div class="mapcard"><div class="maptitle"><b>${esc(t)}</b><span class="note">${esc(sub)}</span></div>${mapHTML()}<div class="legend">${legendHTML()}</div></div><div class="panel">${panelHTML()}</div></div>`;
    wireMap(m);wirePanel(m);
  }else if(S.tab==='catalogue'){m.innerHTML=catalogueHTML();m.querySelectorAll('tr[data-ind]').forEach(tr=>tr.onclick=()=>setSel({ind:tr.dataset.ind,tab:'explore'}))}
  else if(S.tab==='crops'){m.innerHTML=cropsHTML();wireCrops()}
  else if(S.tab==='countries'){m.innerHTML=countriesHTML();wireCountries()}
  else {m.innerHTML=matrixHTML();wireMatrix()}
}
if(S.ind&&!IND[S.ind])S.ind='';if(S.iso&&!CBY[S.iso])S.iso='';if(S.crop&&!CROP[S.crop])S.crop='';
go();
</script>
