sources:
  fao_production:
    mart:
      table: fct_production
      value: value
      year_sql: t.year
      where: t.production_grain = 'physical'
      product_sql: pr.product_name
      join: LEFT JOIN `{project}.mart_dev.dim_product` pr ON pr.product_key = t.product_key
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_production_Crops_and_livestock
  yield_survey:
    mart:
      table: fct_yield
      value: yield_value
      year_sql: t.year
      product_sql: pr.product_name
      join: LEFT JOIN `{project}.mart_dev.dim_product` pr ON pr.product_key = t.product_key
    landing:
      kind: harveststat_yield
  producer_prices:
    mart:
      table: fct_prices
      value: value
      year_sql: t.year
      where: LOWER(t.price_source) = 'faostat'
      product_sql: pr.product_name
      join: LEFT JOIN `{project}.mart_dev.dim_product` pr ON pr.product_key = t.product_key
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Prices_Producer_Prices
  hdx_prices:
    mart:
      table: fct_prices
      value: value
      year_sql: t.year
      where: LOWER(t.price_source) != 'faostat'
      product_sql: pr.product_name
      join: LEFT JOIN `{project}.mart_dev.dim_product` pr ON pr.product_key = t.product_key
    landing:
      kind: hdx_prices
  trade:
    mart:
      table: fct_trade
      value: value
      year_sql: t.year
      product_sql: t.product_name
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Trade_Crops_and_livestock_products
  border_trade:
    mart:
      table: fct_trade
      value: value
      year_sql: t.year
      where: t.border_point IS NOT NULL
      product_sql: t.product_name
  food_balance:
    mart:
      table: fct_food_balance
      value: value
      year_sql: t.year
      product_sql: pr.product_name
      join: LEFT JOIN `{project}.mart_dev.dim_product` pr ON pr.product_key = t.product_key
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Food_Balances_Supply_Utilization_Accounts_2010-23
  emissions:
    mart:
      table: fct_emissions
      value: value
      year_sql: t.year
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Climate_Change_Agrifood_systems_emissions_Totals_and_Indicators_Emissions_totals
  employment:
    mart:
      table: fct_employment
      value: value
      year_sql: t.year
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Population_and_Employment_Employment_Indicators_Employment_Indicators_Agriculture_and_agrifood_systems
  macro:
    mart:
      table: fct_economics
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(t.metric), r'agric') AND REGEXP_CONTAINS(LOWER(t.metric),
        r'gdp|share')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Macro-Economic_Indicators_Macro_Indicators
  exchange:
    mart:
      table: fct_economics
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(t.metric), r'exchange')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Prices_Exchange_rates
  cpi:
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Prices_Consumer_Price_Indices
  fertilizer:
    mart:
      table: fct_land_inputs
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(t.metric), r'fertil')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Land_Inputs_and_Sustainability_Inputs_Fertilizers_by_Nutrient
  pesticide:
    mart:
      table: fct_land_inputs
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(t.metric), r'pestic')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Land_Inputs_and_Sustainability_Inputs_Pesticides_Use
  machinery:
    mart:
      table: fct_machinery
      value: value
      year_sql: t.year
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Discontinued_archives_and_data_series_Machinery
  land_use:
    mart:
      table: fct_land_use
      value: area
      year_sql: t.time_key
      iso_sql: g.country_iso3
      product_sql: lu.land_use_class
      join: LEFT JOIN `{project}.mart_dev.dim_geography` g ON g.geography_key = t.geo_key
        LEFT JOIN `{project}.mart_dev.dim_land_use` lu ON lu.land_use_key = t.land_use_key
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Land_Inputs_and_Sustainability_Land_Land_Use
  temperature:
    mart:
      table: fct_climate
      value: value
      year_sql: EXTRACT(YEAR FROM t.as_of_date)
      where: t.metric = 'temperature_2m'
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Land_Inputs_and_Sustainability_Climate_Change_Indicators_Temperature_change_on_land
  ndvi:
    mart:
      table: fct_vegetation
      value: value
      year_sql: COALESCE(EXTRACT(YEAR FROM t.as_of_date), EXTRACT(YEAR FROM t.loaded_at))
      where: t.vegetation_grain = 'ndvi_grid'
  soil:
    mart:
      table: fct_soil_health
      value: value
      year_sql: COALESCE(EXTRACT(YEAR FROM t.as_of_date), EXTRACT(YEAR FROM t.loaded_at))
  household:
    mart:
      table: fct_household
      value: hh_size
      year_sql: COALESCE(EXTRACT(YEAR FROM t.as_of_date), EXTRACT(YEAR FROM t.loaded_at))
  animal:
    mart:
      table: fct_animal_health
      value: mortality_count
      year_sql: COALESCE(EXTRACT(YEAR FROM t.loaded_at))
  food_security_suite:
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Food_Security_and_Nutrition_Suite_of_Food_Security_Indicators
  fews:
    mart:
      table: fct_food_security
      value: value
      year_sql: t.year
  healthy_diet:
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Cost_and_Affordability_of_a_Healthy_Diet_Cost_and_Affordability_of_a_Healthy_Diet
  gov_expenditure:
    mart:
      table: fct_investment
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(COALESCE(t.metric, '')), r'government|expenditure')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Investment_Government_Expenditure
  asti:
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Agricultural_Science_and_Technology_ASTI-Expenditures
  oda:
    mart:
      table: fct_investment
      value: value
      year_sql: t.year
      where: REGEXP_CONTAINS(LOWER(COALESCE(t.purpose, '')), r'agric')
    landing:
      kind: faostat_wide
      dataset: landing
      table: FAOstat_africa_Investment_Development_Flows_to_Agriculture
  humanitarian:
    mart:
      table: fct_humanitarian
      value: value
      year_sql: t.year
