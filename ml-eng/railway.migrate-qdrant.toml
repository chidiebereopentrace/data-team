# Railway configuration for the one-shot Qdrant Cloud -> self-managed migration job.
# See deploy/RAILWAY_QDRANT_MIGRATION.md.
# https://docs.railway.app/deploy/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.migrate-qdrant"
watchPatterns = ["ml/rag/ops/**", "Dockerfile.migrate-qdrant"]

[deploy]
startCommand = "python -m ml.rag.ops.migrate_qdrant"
numReplicas = 1
restartPolicyType = "NEVER"
