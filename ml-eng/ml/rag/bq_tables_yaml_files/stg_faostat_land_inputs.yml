table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_land_inputs
description: >
  FAOSTAT land use/cover, fertilizers, pesticides, manure, nutrient balance,
  and related bioenergy inputs. Rows are country-level facts (not continent
  aggregates). Filter by exact item + element + unit; never invent labels.
  Do not SUM across unrelated item families (land vs fertilizer vs pesticide
  vs manure vs bioenergy) in one query.
grain: country × item × element × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × item × element × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - land
  - fertilizer
  - faostat
business_questions_supported:
- What is fertilizer use by country?
- What is agricultural land / cropland / arable land area?
- What is pesticide use (total or by class)?
- What is nutrient nitrogen / phosphate / potash use or cropland nutrient intensity?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not join a geo dimension
- This table mixes land use/cover, fertilizer nutrients, pesticides, livestock/manure N, nutrient balance, and bioenergy — filter item+element to one family
- Never SUM across unrelated item families in one query
- Filter element to exactly one metric; never SUM across different elements
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer headline items for generic questions: Nutrient nitrogen N (total) / Nutrient phosphate P2O5 (total) / Nutrient potash K2O (total) or Mineral fertilizers with Agricultural Use; land → Agricultural land / Cropland / Arable land; pesticides → Pesticides (total) unless a class is named
- Prefer primary items over rollups (Agriculture, Input, Outputs, Major livestock types, All Animals, Pesticides (total)) unless totals are asked
- Pesticide labels may differ by hyphen vs en-dash (Herbicides - nes vs Herbicides – Carbamates) — use the exact sample string
- Filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed
- Filter item = '<exact FAOSTAT label>' when a land class, nutrient, pesticide, or livestock item is named
- GROUP BY country_name, item, year when comparing
- Prefer element = 'Agricultural Use' for fertilizer/pesticide use; prefer element = 'Area' (or share elements) for land extent
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: partner_country_code
  type: STRING
  description: partner country code (when populated)
- name: partner_country_code_m49
  type: STRING
  description: partner country code m49 (when populated)
- name: partner_countries
  type: STRING
  description: partner countries (when populated)
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: item
  type: STRING
  description: >
    FAOSTAT land/inputs item (land class, fertilizer, pesticide, livestock,
    nutrient-balance flow, or bioenergy). Filter with an exact item. Prefer
    primary items over rollups. Never invent labels. Do not SUM primary rows
    with aggregate rollups together.

    Family rules:
    Livestock — Cattle, dairy/non-dairy, Sheep, Goats, Swine*, Chickens*,
    Poultry Birds, Buffalo, Equidae, Major livestock types, All Animals.
    Fertilizers / nutrients — Nutrient nitrogen N / phosphate P2O5 / potash K2O
    (total), Mineral fertilizers, Urea, DAP, MAP, NPK, MOP/SOP, other N/P/K
    compounds and n.e.c. fertilizers.
    Pesticides — Pesticides (total), Insecticides/Herbicides/Fungicides/
    Rodenticides classes and actives, Hazardous pesticides, Plant Growth
    Regulators. Watch hyphen vs en-dash spelling in samples.
    Land use/cover — Agricultural land, Cropland, Arable land, Forest land,
    meadows/pastures, irrigation/organic/tillage variants, Country area, etc.
    Nutrient-balance flows — Leaching, Volatilisation, Atmospheric deposition,
    Crop harvest/residue removal, Biological fixation, Manure applied, Input,
    Outputs, Nutrient balance.
    Bioenergy / fuels — Solid/liquid/gaseous biofuels, Fuelwood, Charcoal,
    Bagasse, Total Bioenergy.
    Waters — Inland/coastal waters, EEZ, aquaculture/capture-fisheries uses.
- name: months_code
  type: STRING
  description: months code (when populated)
- name: months
  type: STRING
  description: months (when populated)
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element (one metric
    per query). Do not mix elements in the same SUM/AVG. Always read value
    together with unit.

    Family rules:
    Area / shares — Area, Area per capita, Share in Land/Cropland/Agricultural/
    Forest land, Area from CGLS/CCI_LC/MODIS/WorldCover, Standard Deviation.
    Use / production / trade — Agricultural Use, Production, Import/Export
    quantity or value, Use per capita / per cropland area / per Ag production.
    Manure N pathways — Amount excreted, Manure applied to soils, left on
    pasture, management/losses, leach/volatilise variants (N content).
    Cropland nutrients — Cropland nitrogen/phosphorus/potassium (level, per
    unit area, use efficiency); nutrient trade in tonnes N/P/K.
    Energy — Energy production, Energy consumption.
    Livestock density — Stocks, Share in total livestock, LSU per ag land area.
    Other — Carbon stock in living biomass, Temperature change, Value of
    agricultural production (Int. $) per Area.

    Defaults: fertilizer/pesticide use → Agricultural Use; land extent → Area
    (or share elements when asked).
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit;
    never compare or SUM unlike units.

    1000 ha — land area in thousand hectares.
    t / million t / kg — mass quantities.
    kg/ha / kg/cap / LSU/ha / ha/cap — intensities and densities.
    % / %LSU — shares.
    LSU / An — livestock units / animal counts.
    TJ — energy.
    1000 USD / USD_PPP/ha / g/Int$ — money or productivity ratios.
    °C — temperature change.
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element. SUM across items/years only when element
    and unit are homogeneous. Never SUM across different elements or unlike units.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
