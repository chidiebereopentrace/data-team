semantic_relationships:
  joins_with:
  - table: stg_faostat_production
    'on':
    - country_name
    - year
    how: enrich
    note: Inputs vs production
  - table: stg_faostat_emissions
    'on':
    - country_name
    - year
    how: enrich
    note: Fertilizer/land-use vs emissions
  - table: stg_isric_africa_soil
    'on':
    - country via spatial
    how: enrich
    note: Soil constraints (spatial join caution)
  companions:
  - table: stg_unccd_land_degradation
    when: degradation pressure
    role: enrich_context
  do_not_join:
  - table: stg_ilri_vendor_consumer
    reason: survey microdata
