_index_domain: fews
_index_tags: *id001
semantic_relationships:
  joins_with:
  - table: stg_fews_market_prices
    'on':
    - country
    - product_name
    - year
    - month
    how: enrich
    note: Trade flows vs market prices
  - table: stg_faostat_trade
    'on':
    - country_name≈country
    - product_name
    - year
    how: compare
    note: FEWS border flows vs FAOSTAT trade
  companions:
  - table: stg_wfp_vampire_prices
    when: price shocks along corridors
    role: enrich_context
  do_not_join:
  - table: stg_ilri_dairy_genetics
    reason: farm microdata; no trade grain
