table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_food_balances
description: >
  FAOSTAT food balances and supply utilization accounts.
  Rows are country-level facts (not continent aggregates). Filter by exact
  product_name + element + unit; never invent labels.
grain: country × product × element × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × product × element × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - food balances
  - nutrition
  - faostat
business_questions_supported:
- What is food supply for a commodity?
- What is domestic supply or food availability for a crop?
- What is per-capita kcal or protein supply?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not join a geo dimension
- Filter element to exactly one metric; never SUM across different elements
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer Domestic supply quantity, Food, Food supply quantity (kg/capita/yr), Food supply (kcal/capita/day), Production, Import Quantity / Export Quantity for generic supply questions (exact casing)
- Element labels may differ only by casing (Import Quantity vs Import quantity; Loss vs Losses; Processed vs Processing) — use the exact sample string
- Prefer primary product_name commodities over FBS aggregates (Grand Total, Cereals - Excluding Beer, Meat, Milk - Excluding Butter, "... and products" groups) unless totals are asked
- Never SUM primary commodities together with aggregate product rows in the same query
- Filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed
- Filter product_name = '<exact FAOSTAT label>' when a commodity is named
- GROUP BY country_name, product_name, year when comparing
- Prefer element = 'Domestic supply quantity' or 'Food supply (kcal/capita/day)' depending on whether mass supply or diet energy is asked
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_fbs
  type: STRING
  description: FBS item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: product_name
  type: STRING
  description: >
    FAOSTAT food-balance commodity / product label. Filter with an exact
    product_name. Prefer primary commodities over FBS aggregates. Never invent
    labels. Do not SUM primary rows with Grand Total / group aggregates together.

    Family rules:
    Meats, offals, dairy, eggs — fresh/chilled meats, preparations, milk, cheese,
    butter/ghee, whey, eggs.
    Cereals and flours — wheat, rice, maize, millets, bran, flour, gluten, pasta,
    bread, breakfast cereals; group rows like "Wheat and products".
    Roots, tubers, starches — potatoes, cassava, yams, taro, tapioca, starches.
    Sugars and sweeteners — raw/refined sugar, molasses, fructose, honey, confectionery.
    Pulses, oilcrops, oils, cakes — beans, groundnuts, soya, palm, oils, oilseed cakes.
    Vegetables, fruits, juices — fresh, dried, preserved, juices, concentrates.
    Beverages, stimulants, spices — beer, wine, spirits, coffee, tea, cocoa, spices.
    Fish and aquatic — freshwater/demersal/pelagic, crustaceans, molluscs, oils.
    Industrial / residues — bran, cakes, rubber, tobacco, silk, wool grease.
    Population — Total Population / Population (with population elements/units).
    Aggregates — Grand Total, Cereals - Excluding Beer, Meat, Milk - Excluding Butter,
    Starchy Roots, Oilcrops, "... and products" — use only when totals are asked.
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element label
    (one metric per query). Do not mix elements in the same SUM/AVG.
    Always read value together with unit. Watch casing duplicates in samples.

    Family rules:
    Supply identity — Domestic supply quantity, Production, Import Quantity /
    Import quantity, Export Quantity / Export quantity, Opening stocks,
    Stock Variation.
    Utilization — Food, Feed, Seed, Loss / Losses, Processed / Processing,
    Other uses (non-food), Tourist consumption, Residuals.
    Per-capita / nutrient supply — Food supply (kcal/capita/day), Food supply
    quantity (kg/capita/yr), Food supply quantity (g/capita/day), protein/fat
    supply (g/capita/day or t), Food supply (kcal), Food supply quantity (tonnes).
    Annual nutrient totals — Calories/Year, Proteins/Year, Fats/Year.
    Population — Total Population - Both sexes (pair with 1000 No).

    Defaults: mass availability → Domestic supply quantity or Food; diet energy →
    Food supply (kcal/capita/day); trade → Import/Export Quantity (exact casing).
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit;
    never compare or SUM unlike units.

    kcal/cap/d — kilocalories per capita per day.
    kg/cap — kilograms per capita (often per year food supply).
    g/cap/d — grams per capita per day (protein/fat supply).
    million Kcal — million kilocalories (annual totals).
    1000 t — thousand tonnes.
    t — tonnes.
    1000 No — thousand persons (population counts).
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element. SUM across products/years only when element
    and unit are homogeneous. Never SUM across different elements or unlike units.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
