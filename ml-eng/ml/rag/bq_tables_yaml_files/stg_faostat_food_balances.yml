semantic_relationships:
  joins_with:
  - table: stg_faostat_production
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Supply accounts vs production
  - table: stg_faostat_trade
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Import/export in balances
  - table: stg_fews_food_security
    'on':
    - country≈country_name
    - year
    how: compare
    note: National availability vs IPC
  companions:
  - table: stg_faostat_sdg_hdi
    when: diet cost / SDG nutrition indicators
    role: enrich_context
  do_not_join:
  - table: stg_germplasm
    reason: accession geography; not food balances
  - table: dim_geography
    reason: not in staging catalog; never invent geo dims for Africa country lists
