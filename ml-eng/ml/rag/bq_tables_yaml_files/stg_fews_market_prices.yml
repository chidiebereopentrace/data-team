table_name: opentrace-prod-5ga4.staging_dev.stg_fews_market_prices
description: >
  FEWS NET monthly market prices for staples, livestock, fuels, wages/services,
  and related products at named markets. Filter by exact product_name +
  price_type + market_name (+ country / year / month / unit / currency); never
  invent labels. Do not AVG or SUM across unlike products, price types, units,
  or currencies without using harmonized common_* fields.
grain: country × market × product × year × month × price_type
entity_type: fews
source:
  layer: staging_dev
  domain: fews
relationships:
  primary_key:
    type: logical
    fields: country × market × product × year × month × price_type
semantic_role:
  primary_domain: fews
  supports: &id001
  - markets
  - prices
  - fews
business_questions_supported:
- What are maize, sorghum, or rice prices in a named market?
- How do retail vs wholesale prices differ for a staple?
- How have market prices changed over recent months?
- How do prices compare across markets or countries using common_currency_price?
- What are livestock, fuel, or wage rates in a market?
filtering_guidance:
- Filter by geography and time when present
- country holds country labels only — never filter country = 'Africa' or a region
- Filter market_name with an exact label (city; "City, Market"; Open market / Supermarket / Service station variants; district averages; National/Composite averages)
- Prefer specific named markets over National Average / National / Composite (*) / district averages unless totals are asked
- Always filter product_name to an exact FEWS label; prefer specific grain variants (e.g. Maize Grain (White)) over broad labels when both exist
- Always filter price_type; prefer Retail for consumer prices; use Wholesale / Export / Spot / Wage when asked
- Always pair value with unit and currency; prefer common_currency_price for cross-market or cross-country compares; prefer common_unit_price when units differ
- Never AVG or SUM across unlike products, price types, units, or currencies without harmonized fields
- Filter year and month for time-bounded questions
- Never invent warehouse dimension tables (dim_*)
- Joins to FAOSTAT or WFP prices are approximate product-name matches only — do not assume identical labels
sql_generation_hints:
- Filter country, market_name, product_name, and price_type with exact labels
- Filter year and month for time series
- Prefer common_currency_price for cross-market compare; prefer common_unit_price when units differ
- GROUP BY country, market_name, product_name, year, month (plus price_type) when comparing
- Never invent warehouse dimension tables (dim_*)
columns:
- name: country
  type: STRING
  description: Country name only. Never 'Africa' or a region label.
- name: country_code
  type: STRING
  description: country code
- name: admin_1
  type: STRING
  description: Admin level 1 label when populated
- name: admin_2
  type: STRING
  description: Admin level 2 label when populated
- name: market_name
  type: STRING
  description: >
    Named market or average where the price is observed. Filter with an exact
    market_name. Prefer specific markets over National Average / National /
    Composite (*) / district averages unless totals are asked. Never invent
    labels.

    Family rules:
    Named markets — city or town names; "City, Market" compounds.
    Zimbabwe channels — Open market, Supermarket, and Service station variants.
    Averages — district average, National Average, National, Composite
    (Mombasa), Composite (North Africa).
- name: product_name
  type: STRING
  description: >
    FEWS NET product label for the priced good or service. Filter with an
    exact product_name. Prefer specific variants over unspecified/mixed when
    both exist. Never invent labels. Do not AVG unlike products together.

    Family rules:
    Cereals / flours / meals — maize grain/flour/meal, sorghum/millet/teff/
    fonio, wheat grain/flour, bran.
    Rice grades — milled, broken, long/medium/short grain, parboiled, etc.
    Pulses / oilseeds — beans, lentils, chick peas, cowpeas, groundnuts,
    sesame, soybean oil inputs.
    Roots / tubers / fruits / veg — cassava, yams, potatoes, banana, tomato,
    onions, leafy greens, mango, etc.
    Livestock / animal products — cattle/sheep/goats/camels grades, chickens,
    meat, milk, eggs, dried fish.
    Oils / fuels / energy — vegetable/palm/groundnut oils, gasoline, diesel,
    kerosene, LPG, charcoal, firewood.
    Wages / services / other — casual/agricultural labor, bus fares, lodging,
    utilities, fertilizer, soap, uniforms.
- name: cpcv2
  type: STRING
  description: CPC v2 product classification code when populated
- name: price_type
  type: STRING
  description: >
    Price channel for the row. Filter with an exact price_type. Prefer Retail
    for consumer staple prices unless another channel is asked.

    Family rules:
    Wholesale — trader/wholesale market prices.
    Retail — consumer retail prices (default for staple price questions).
    Export — export-facing prices.
    Spot — spot market prices.
    Wage — wage / labor rate rows (pair with labor product labels).
- name: unit
  type: STRING
  description: >
    Unit of the reported price. Always interpret value with unit and currency;
    never compare unlike units without common_unit_price.

    Family rules:
    Mass — kg and bag/pack sizes (50_kg, 100_kg, 90_kg, g packs, etc.).
    Volume — L and fractions (0.5_L, 5_L, gal, bbl, 1000_L).
    Count / bundle — ea, ea_*, bundle, pile, bunch, loaf, Plate, Cart load,
    100_tubers, cup.
    Services / energy — day, One_way_trip, 200_kwh, cum.
- name: currency
  type: STRING
  description: >
    Local currency code for value. Filter with an exact currency. Prefer
    common_currency_price for cross-currency compares. Note ZWL vs ZWL_cash
    and historical MRO vs MRU — use the exact sample code.
- name: value
  type: FLOAT64
  description: >
    Local-currency price in the stated unit. AVG only when product_name,
    price_type, unit, and currency are homogeneous (or use common_* fields).
- name: common_unit_price
  type: STRING
  description: >
    Harmonized unit price for cross-unit compares when populated. Prefer over
    raw value when units differ across rows.
- name: common_currency_price
  type: STRING
  description: >
    Harmonized currency price for cross-market or cross-country compares when
    populated. Prefer over raw value when currencies differ.
- name: year
  type: INT64
  description: Observation year
- name: month
  type: INT64
  description: Observation month (1-12)
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
