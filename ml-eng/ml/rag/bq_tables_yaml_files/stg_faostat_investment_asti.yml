table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_investment_asti
description: >
  FAOSTAT agricultural investment flows (ODA/CRS, credit, FDI, government
  expenditure) and ASTI R&D indicators. Rows are country-level facts (not
  continent aggregates). Filter by exact donor/purpose/item/element or
  indicator/institution/degree plus unit; never invent labels. Do not SUM
  across unrelated metric families (ODA flows vs ASTI R&D vs FDI) in one query.
grain: country × indicator/purpose × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × indicator/purpose × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - investment
  - faostat
business_questions_supported:
- How much agricultural R&D spending is there?
- How much ODA / disbursement goes to agricultural research or development?
- What is government agriculture expenditure or the Agriculture Orientation Index?
- What is FDI or credit to agriculture, forestry, and fishing?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not join a geo dimension
- This table mixes ODA/CRS flows (donor × purpose × item/element), ASTI R&D (indicator × institution × degree), and government expenditure / credit / FDI items — filter only the dimensions that apply
- Never SUM across unrelated metric families in one query
- Filter element to exactly one metric (or one indicator for ASTI); never SUM across different elements/indicators
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer named bilateral/multilateral/foundation donors over rollups (All Donors, Bilateral Donors, Multilateral Donors, Private Donors) unless totals are asked
- Prefer concrete CRS purposes (Agricultural research, Agricultural development, …) over All CRS purposes unless totals are asked
- For generic ag R&D spend prefer ASTI indicators (e.g. Total Expenditure in Agricultural R&D (US$, 2015 prices)) with institution/degree when present
- For aid flows prefer Disbursement / Commitment / ODA item variants with a matching element value metric
- Purpose labels may differ only by casing or plural (Rural development vs Rural Development; Agro-industry vs Agro-industries) — use the exact sample string
- Filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' or indicator = '<exact label>' for the metric needed
- Filter donor / purpose / item with exact FAOSTAT labels when named
- GROUP BY country_name, year plus the entity dims used in the filter
- Prefer element = 'Value US$, 2015 prices' or 'Value US$' for comparable money totals unless a share/AOI/SDG metric is asked
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: donor_code
  type: STRING
  description: donor code
- name: donor_code_m49
  type: STRING
  description: donor code m49
- name: donor
  type: STRING
  description: >
    Funding source / donor label for ODA and related flows. Filter with an exact
    donor. Prefer named countries, MDBs, UN agencies, and foundations over
    rollups. Never invent labels. Do not SUM named donors with All Donors /
    Bilateral / Multilateral / Private Donors rollups together.

    Family rules:
    Countries — Belgium, Germany, France, United States of America, Japan, etc.
    MDBs / UN / public funds — AfDB, IFAD, IDA, IBRD, FAO, UNDP, GEF, Green
    Climate Fund, EU Institutions, etc.
    Foundations / private — Gates, Rockefeller, Packard, MasterCard Foundation, etc.
    Rollups — All Donors, Bilateral Donors, Multilateral Donors, Private Donors
    (use only when totals are asked).
- name: purpose_code
  type: STRING
  description: purpose code
- name: purpose
  type: STRING
  description: >
    CRS purpose / sector for aid flows. Filter with an exact purpose. Prefer
    concrete purposes over All CRS purposes. Watch near-duplicates in samples
    (Rural development vs Rural Development; Agro-industry vs Agro-industries).

    Family rules:
    Agriculture / livestock / fishery / forestry — production, policy, services,
    research, education/training, extension, inputs, water, land, co-operatives.
    Rural development — Rural development / Rural Development.
    Environment — General Environment Protection, Bio-diversity, Biosphere
    protection, environmental policy/research/education.
    Agro-industry / other — Agro-industry(ies), fertilizer, biofuels, textiles,
    cottage industries.
    Totals — All CRS purposes (only when totals are asked).
- name: item_code
  type: STRING
  description: item code
- name: item
  type: STRING
  description: >
    Flow or expenditure item. Filter with an exact item. Prefer the item family
    matching the question (aid commitment/disbursement vs government expenditure
    vs credit vs FDI vs ASTI/SDG). Never invent labels.

    Family rules:
    Aid flows — Commitment, Disbursement, Commitment/Disbursement ODA or OOF,
    private grant / private sector instrument variants.
    Government expenditure — Agriculture / forestry / fishing / environmental
    protection / biodiversity; central vs general government; capital vs
    recurrent; R&D variants; Total Expenditure.
    Credit — Credit to Agriculture / Fishery / Forestry and combinations.
    FDI — Total FDI inflows/outflows; sector FDI to AFF or Food/Beverages/Tobacco.
    Macro — Gross Fixed Capital Formation (AFF), Value Added (AFF).
    SDG / orientation — SDG 2.a.1 highest government level and related.
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value (flows/expenditure/FDI). Filter with an
    exact element (one metric per query). Do not mix elements in the same
    SUM/AVG. Always read value together with unit.

    Family rules:
    Absolute values — Value US$; Value US$, 2015 prices; Value US$, 2023 prices;
    Value Standard Local Currency (with/without 2015 prices).
    Shares / ratios — Share of Total*, Share of Value Added, Share of Total
    Expenditure / Credit / FDI; Ratio of Value Added (AFF).
    AOI / SDG 2.a.1 — Agriculture orientation index*; Agriculture share of
    Government Expenditure; Agriculture value added share of GDP.
    Growth — Annual growth US$, 2015 prices.

    Default money totals → Value US$, 2015 prices or Value US$ unless a share
    or AOI/SDG metric is asked.
- name: indicator_code
  type: STRING
  description: indicator code
- name: indicator
  type: STRING
  description: >
    ASTI agricultural R&D indicator label. Use when the question is ASTI/R&D
    spend or researcher intensity. Filter with an exact indicator. Pair with
    institution / degree when present. Prefer US$ 2015-price expenditure for
    comparable R&D spend rankings.
- name: institution_code
  type: STRING
  description: institution code
- name: institution
  type: STRING
  description: >
    ASTI institutional coverage. Sample value is Government, Higher Education
    and Private Non-profit. Filter when ASTI rows use this dimension.
- name: degree_code
  type: STRING
  description: degree code
- name: degree
  type: STRING
  description: >
    ASTI degree / aggregation grain. Sample value is Total. Filter when ASTI
    rows use this dimension.
- name: sex_code
  type: STRING
  description: sex code
- name: sex
  type: STRING
  description: sex (when populated)
- name: cost_category_code
  type: STRING
  description: cost category code
- name: cost_category
  type: STRING
  description: cost category (when populated)
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element/indicator. Always interpret value with
    element or indicator + unit; never compare or SUM unlike units.

    % — shares, AOI, intensity ratios.
    million USD — monetary values in million US dollars.
    million SLC — monetary values in million standard local currency.
    No — counts (e.g. FTE researchers).
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element or indicator. SUM across donors/purposes/
    years only when element (or indicator) and unit are homogeneous. Never SUM
    across different elements/indicators or unlike units.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
