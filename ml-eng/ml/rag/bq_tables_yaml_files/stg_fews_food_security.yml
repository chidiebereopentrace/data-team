table_name: opentrace-prod-5ga4.staging_dev.stg_fews_food_security
description: FEWS NET food security / IPC phases and insecure population estimates.
grain: fnid/admin × year × month × measure_type × scenario
entity_type: fews
source:
  layer: staging_dev
  domain: fews
relationships:
  primary_key:
    type: logical
    fields: fnid/admin × year × month × measure_type × scenario
semantic_role:
  primary_domain: fews
  supports: &id001
  - food security
  - ipc
  - fews
business_questions_supported:
- Which districts are in IPC phase 3+?
- How has food insecurity changed recently?
filtering_guidance:
- Filter by geography and time when present
- country holds country labels only — never filter country = 'Africa' or a region
- Prefer phase_code / pct_phase3+ for severity; filter year and month for recent status
- Subnational grain (fnid/admin); do not invent dim_* for Africa country lists
sql_generation_hints:
- Filter by country/fnid and year/month
- Use phase_code or pct_phase3-5 for severity
- GROUP BY geography for which-region questions
- Never invent warehouse dimension tables (dim_*)
columns:
- name: fnid
  type: STRING
  description: fnid
- name: country
  type: STRING
  description: Country name only. Never 'Africa' or a region label.
- name: country_code
  type: STRING
  description: country code
- name: admin_0
  type: STRING
  description: admin 0
- name: admin_1
  type: STRING
  description: admin 1
- name: admin_2
  type: STRING
  description: admin 2
- name: admin_3
  type: STRING
  description: admin 3
- name: admin_4
  type: STRING
  description: admin 4
- name: geographic_unit_name
  type: STRING
  description: geographic unit name
- name: fewsnet_region
  type: STRING
  description: fewsnet region
- name: phase_code
  type: STRING
  description: phase code
- name: phase_name
  type: STRING
  description: phase name
- name: classification_scale
  type: STRING
  description: classification scale
- name: scenario_name
  type: STRING
  description: scenario name
- name: value
  type: FLOAT64
  description: value
- name: low_value
  type: STRING
  description: low value
- name: high_value
  type: STRING
  description: high value
- name: pct_phase3
  type: FLOAT64
  description: pct phase3
- name: pct_phase4
  type: FLOAT64
  description: pct phase4
- name: pct_phase5
  type: FLOAT64
  description: pct phase5
- name: is_allowing_for_assistance
  type: STRING
  description: is allowing for assistance
- name: year
  type: INT64
  description: year
- name: month
  type: INT64
  description: month
- name: measure_type
  type: STRING
  description: measure type
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
_index_domain: fews
_index_tags: *id001
semantic_relationships:
  joins_with:
  - table: stg_yield_raw_data
    'on':
    - country
    - fnid
    - year
    how: enrich
    note: Food security vs production stress
  - table: stg_fews_market_prices
    'on':
    - country
    - year
    - month
    how: enrich
    note: IPC with contemporaneous prices
  - table: stg_wfp_vampire_prices
    'on':
    - country
    - year
    - month
    how: enrich
    note: IPC with WFP price series
  - table: stg_faostat_food_balances
    'on':
    - country_name≈country
    - year
    how: compare
    note: National food availability context
  companions:
  - table: stg_climatewatch_health
    when: climate-health stress overlaps
    role: enrich_context
  do_not_join:
  - table: stg_openaire_persons
    reason: no shared geo-time grain
  - table: dim_geography
    reason: not in staging catalog; never invent geo dims for Africa country lists
