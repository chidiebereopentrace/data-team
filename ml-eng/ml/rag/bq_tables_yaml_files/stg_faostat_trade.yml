table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_trade
description: FAOSTAT crop and livestock trade products and indices.
grain: country × product × element × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × product × element × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - trade
  - faostat
business_questions_supported:
- What are import/export volumes?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not invent dim_* geo tables
- Filter element to Import/Export quantity or value as asked (not indices unless asked)
sql_generation_hints:
- Filter country_name and year
- Filter element for the metric needed (e.g. Import Quantity, Export Quantity)
- GROUP BY country_name, product_name, year when comparing
- "Continental trade ranking: SUM(value) GROUP BY country_name ORDER BY total DESC; single-table; no dim_geography"
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only. Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: product_name
  type: STRING
  description: product name
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type. Common values: Import Quantity, Export Quantity,
    Import Value, Export Value. Filter before aggregating.
- name: year
  type: INT64
  description: year
- name: unit
  type: STRING
  description: unit
- name: value
  type: FLOAT64
  description: Numeric measure for the element
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
element_value_samples:
- Import Quantity
- Export Quantity
- Import Value
- Export Value
_index_domain: faostat
_index_tags: *id001
semantic_relationships:
  joins_with:
  - table: stg_faostat_production
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Trade vs domestic production
  - table: stg_fews_cross_border_trade
    'on':
    - country≈country_name
    - product_name
    - year
    how: compare
    note: FAOSTAT vs FEWS corridor flows
  - table: stg_faostat_food_balances
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Trade in food balance context
  companions:
  - table: stg_faostat_prices
    when: unit value / price context
    role: enrich_context
  do_not_join:
  - table: stg_nakuru_air_quality
    reason: local sensors only
  - table: dim_geography
    reason: not in staging catalog; never invent geo dims for Africa country lists
