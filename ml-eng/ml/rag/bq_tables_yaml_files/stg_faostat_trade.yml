_index_domain: faostat
_index_tags: *id001
semantic_relationships:
  joins_with:
  - table: stg_faostat_production
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Trade vs domestic production
  - table: stg_fews_cross_border_trade
    'on':
    - country≈country_name
    - product_name
    - year
    how: compare
    note: FAOSTAT vs FEWS corridor flows
  - table: stg_faostat_food_balances
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Trade in food balance context
  companions:
  - table: stg_faostat_prices
    when: unit value / price context
    role: enrich_context
  do_not_join:
  - table: stg_nakuru_air_quality
    reason: local sensors only
  - table: dim_geography
    reason: not in staging catalog; never invent geo dims for Africa country lists
