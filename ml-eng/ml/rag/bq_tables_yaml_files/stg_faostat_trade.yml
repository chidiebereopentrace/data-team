table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_trade
description: >
  FAOSTAT crop and livestock merchandise trade: import/export quantity and
  value flows, trade indices (2014-2016 = 100), and trade-structure ratios.
  Rows are country-level facts (not continent aggregates). Filter by exact
  product_name + element; never invent labels. Do not SUM quantity with value,
  or flows with indices/ratios, in one query.
grain: country × product × element × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × product × element × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - trade
  - faostat
business_questions_supported:
- What is the import or export quantity of a commodity?
- What is the import or export value of a commodity?
- What are trade or unit-value indices for a product?
- What is the import dependency, self-sufficiency, or agricultural trade openness?
- Which countries rank highest for trade of a product (single-table ranking)?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not invent dim_* geo tables
- Filter element to exactly one metric; never SUM across different elements
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer flow elements for volume/value asks: Import quantity, Export quantity, Import value, Export value (exact sample casing)
- Prefer index elements (* Index (2014-2016 = 100)) only when indices are asked
- Prefer ratio elements (Import dependency ratio, Self-sufficiency ratio, Terms of trade, Revealed comparative advantage index, Agricultural trade openness index, Share of agricultural exports to GDP) only when those metrics are asked
- Prefer primary product_name commodities over rollups (Total Merchandise Trade, Cereals, Food Excluding Fish, Crops and livestock products, Meat and Meat Preparations, Dairy Products, Vegetable Oil and Fat, etc.) unless totals are asked
- Never SUM primary product rows with aggregate/rollup product rows in the same query
- Filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed
- Filter product_name = '<exact FAOSTAT label>' when a commodity is named
- GROUP BY country_name, product_name, year when comparing
- Continental trade ranking: filter element + product_name; SUM(value) GROUP BY country_name ORDER BY total DESC; single-table; no dim_geography
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: product_name
  type: STRING
  description: >
    FAOSTAT trade commodity / aggregate label. Filter with an exact
    product_name. Prefer primary commodities over rollups. Never invent
    labels. Do not SUM primary rows with aggregate rollups together.

    Family rules:
    Primary crops — cereals, fruits, vegetables, pulses, oilseeds, sugar
    crops, roots/tubers, stimulants/spices, fibres.
    Live animals — Cattle, Sheep, Goats, Swine / pigs, poultry species,
    camels, equines, bees, other live animals.
    Meats / offals / preparations — fresh or chilled meats, salted/dried/
    smoked, sausages, meat meal, meat preparations.
    Dairy / eggs — milk powders, cheese, butter/ghee, whey, yoghurt, hen
    eggs and related.
    Oils / fats / cakes / bran / feed — crude/refined oils, oilseed cakes,
    bran, compound feed, fodder and feeding stuff.
    Beverages / processed foods — juices, wine/beer/spirits, sugar
    confectionery, infant food, food preparations n.e.c.
    Non-food — hides/skins, wool/hair, rubber, tobacco, textile fibres,
    waxes, crude materials.
    Aggregates / rollups — Total Merchandise Trade, Cereals, Food Excluding
    Fish, Crops and livestock products, Meat and Meat Preparations, Dairy
    Products, Vegetable Oil and Fat, etc. (use only when totals are asked).
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element (one metric
    per query). Do not mix elements in the same SUM/AVG. Always read value
    together with unit. Use exact sample casing (e.g. Import quantity, not
    Import Quantity).

    Family rules:
    Flows — Import quantity; Export quantity; Import value; Export value.
    Indices (2014-2016 = 100) — Import/Export Quantity Index; Import/Export
    Value Index; Import/Export Unit/Value Index.
    Structure ratios — Import dependency ratio; Self-sufficiency ratio;
    Terms of trade; Revealed comparative advantage index; Agricultural
    trade openness index; Share of agricultural exports to GDP.

    Defaults: volume → Import quantity or Export quantity; money → Import
    value or Export value.
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit;
    never compare or SUM unlike units.

    t — trade quantity in tonnes.
    1000 USD — trade value in thousand US dollars.
    % — ratios, shares, and percentage metrics.
    An / 1000 An / No — live-animal or count measures.
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element. SUM across products/years only when
    element and unit are homogeneous. Never SUM quantity with value, or flows
    with indices/ratios, or primary products with aggregate rollups.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
