table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_emissions
description: >
  FAOSTAT agrifood systems emissions (gases, shares, intensities, and related
  activity). Rows are country-level facts (not continent aggregates). Filter by
  exact item + element + unit; never invent labels.
grain: country × item × element × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × item × element × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - emissions
  - climate
  - faostat
business_questions_supported:
- What are agrifood emissions for a country?
- Which country has the highest livestock CH4 / CO2eq emissions?
- What is emissions intensity or emissions per capita?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not join a geo dimension
- Filter element to exactly one metric; never SUM across different elements
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer headline gas totals for generic questions: Emissions (CO2eq) (AR5), Emissions (CH4), Emissions (N2O), Emissions (CO2)
- Use manure / fertilizer / residue / energy / land pathway elements only when the question asks for that pathway
- Prefer primary item commodities/animals/activity categories over sector aggregates unless totals are asked
- Sector aggregates (AFOLU, Agrifood systems, All sectors with/without LULUCF, IPCC Agriculture, Farm gate, etc.) only when the question asks for totals
- Do not mix N-content / activity rows with gas-emission rows in the same SUM
- Filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed
- Filter item = '<exact FAOSTAT label>' when a commodity, animal, or activity is named
- GROUP BY country_name, item, year when comparing
- Prefer element = 'Emissions (CO2eq) (AR5)' for total climate-impact rankings unless a specific gas is named
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: item
  type: STRING
  description: >
    FAOSTAT emissions item (commodity, animal, activity, land class, or sector).
    Filter with an exact item label. Prefer primary commodities/animals/activity
    categories over sector totals. Never invent labels. Do not SUM primary rows
    with aggregate sector rows together.

    Family rules:
    Animals and products — Goats, Sheep, Cattle, dairy/non-dairy, poultry, meats,
    raw milk, eggs, Poultry Birds, All Animals.
    Crops — Wheat, Maize (corn), Rice, Millet, Sorghum, Soya beans, Potatoes,
    Sugar cane, Beans dry, Rye, Oats, Barley, All Crops, Cereals excluding rice.
    IPCC / activity categories — Enteric Fermentation, Manure Management,
    Rice Cultivation, Crop Residues, Burning - Crop residues, Agricultural Soils,
    Synthetic Fertilizers, Manure applied to Soils, Manure left on Pasture.
    Land / LULUCF / fires — Forestland, Grassland, Savanna*, shrubland*, Net Forest
    conversion, Carbon stock change in forests, drained organic soils, fire types.
    Energy carriers — Electricity, Natural gas, Coal, Petroleum products,
    Total Energy, On-farm energy use, Energy Use (Pre- and Post-Production).
    Agrifood stages — Farm gate, Food Transport, Food Retail, Food Processing,
    Food Packaging, Food Household Consumption, Pre- and post-production,
    Fertilizers/Pesticides Manufacturing, Cold Chain F-Gas, waste disposal.
    Sector aggregates — AFOLU, Agrifood systems, Emissions from crops/livestock,
    Emissions on agricultural land, IPCC Agriculture, All sectors with/without
    LULUCF, IPPU, Waste, Energy, LULUCF — use only when totals are asked.
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element label
    (one metric per query). Do not mix elements in the same SUM/AVG.
    Always read value together with unit.

    Family rules:
    Gas totals — Emissions (CH4), Emissions (N2O), Emissions (CO2),
    Emissions (CO2eq) (AR5), Emissions (CO2eq) from CH4/N2O/F-gases (AR5),
    Net emissions/removals (CO2) (Forest land). Default for generic emissions
    questions: Emissions (CO2eq) (AR5).
    Shares — Emissions Share (CO2/CH4/N2O/CO2eq AR5 / F-gases); unit usually %.
    Intensity / normalized — Emissions intensity, Emissions per capita,
    Emissions per area of agricultural land, Emissions per value of agricultural
    production (not absolute mass).
    Manure pathways — applied / left on pasture / manure management; Direct vs
    Indirect (leaches / volatilises); Emissions N2O/CH4 vs N content. Do not mix
    N-content with gas emissions.
    Synthetic fertilizers — Direct/Indirect N2O, Emissions N2O, Agricultural use,
    N fertilizer content that leaches/volatilises.
    Crop residues / burning / rice — N content, Direct/Indirect N2O, CH4 from
    burning or rice cultivation, biomass burned, Burned Area.
    Enteric fermentation — Emissions CH4.
    Livestock/crops totals — Livestock/Crops total (Emissions CH4 or N2O).
    Energy — Energy Use (Total / Electricity / Coal / Natural Gas including LNG),
    Energy use in agriculture.
    Land / activity — Area, Area harvested, Production, Stocks.
- name: source_code
  type: STRING
  description: source code
- name: source
  type: STRING
  description: Emissions source label when present
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit;
    never compare or SUM unlike units.

    An — animal numbers (heads).
    % — share / percentage.
    1000 ha — thousand hectares.
    ha — hectares.
    kg — kilograms (often N content or mass).
    t — tonnes.
    kt — kilotonnes (often gas mass).
    kg CO2eq/kg — emissions intensity per kg product.
    kg CO2eq/Int$ — emissions per international-dollar of production.
    t CO2eq/cap — tonnes CO2eq per capita.
    t CO2eq/ha — tonnes CO2eq per hectare.
    TJ — terajoules (energy).
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element. SUM across items/years only when element
    and unit are homogeneous. Never SUM across different elements or unlike units.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
