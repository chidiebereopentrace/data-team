table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_sdg_hdi
description: >
  FAOSTAT SDG indicators, cost of a healthy diet (CoHD) / diet affordability,
  food value-chain factor shares, and agricultural census holdings. Rows are
  country-level facts (not continent aggregates). Filter by exact item +
  element (+ food_value / industry / factor / release when populated); never
  invent labels. Do not SUM across unrelated families (SDG vs CoHD vs census
  vs food value-chain) in one query.
grain: country × indicator × year
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × indicator × year
semantic_role:
  primary_domain: faostat
  supports: &id001
  - sdg
  - nutrition
  - faostat
business_questions_supported:
- What is the cost of a healthy diet, or how many people cannot afford one?
- What is the prevalence of undernourishment or food insecurity?
- What is the Agriculture Orientation Index or agriculture share of government expenditure?
- What is forest area or mountain green cover?
- What is the level of water stress or water use efficiency?
- What are agricultural census holdings or women's land ownership rights?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental/Africa rankings stay on this table; do not join a geo dimension
- This table mixes SDG indicators, CoHD/diet affordability, food value-chain factors, and agricultural census holdings — filter item+element to one family
- Never SUM across unrelated item families in one query
- Filter element to exactly one metric; never SUM across different elements
- Always interpret value with the matching unit; never SUM across unlike units
- Prefer headline items for generic questions: 2.1.1 Prevalence of undernourishment; 2.1.2 moderate/severe food insecurity both-sexes; Cost of a healthy diet (CoHD), PPP dollar per person per day; Prevalence of unaffordability (PUA), percent; 2.a.1 Agriculture orientation index for government expenditures; 15.1.1 Forest area as a proportion of total land area; 6.4.2 Level of water stress (No breakdown)
- Prefer both-sexes / no breakdown by sex / Total / Montane-Total slices over sex, age, land-cover, or Alpine/Nival slices unless asked
- Prefer PPP CoHD / food-group costs over LCU for cross-country comparisons; prefer Value over Confidence interval bounds unless uncertainty is asked
- Food value-chain dims (food_value, industry, factor) are often null on pure SDG rows — filter them only for value-chain questions
- Source labels may contain typos (e.g. Remaining moutain area) — use the exact sample string
- Filter year for time-bounded questions; filter release when a SOFI vintage is asked
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed (usually Value)
- Filter item = '<exact FAOSTAT label>' for the SDG / CoHD / census indicator named
- Filter food_value / industry / factor only when those dims are populated and relevant
- GROUP BY country_name, item, year when comparing
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_sdg
  type: STRING
  description: SDG item code when populated
- name: item
  type: STRING
  description: >
    SDG indicator, CoHD/diet-cost metric, or agricultural census holding
    label. Filter with an exact item. Prefer headline both-sexes / no-breakdown
    / Total slices over sex, age, or land-cover slices unless asked. Prefer
    PPP over LCU for cross-country CoHD. Never invent labels. Do not SUM
    primary rows with unlike item families together.

    Family rules:
    2.1 undernourishment / food insecurity — Prevalence of undernourishment;
    Number of undernourished people; 2.1.2 moderate/severe and severe food
    insecurity prevalence and numbers (female / male / both sexes).
    2.2 / 2.3 / 2.4 — minimum dietary diversity (women); small/large-scale
    food producer productivity and income; productive and sustainable
    agriculture proxies, trend/status scores, and land-area criteria.
    2.5 genetic resources — local/transboundary breeds stored, kept, at risk,
    unknown risk, plant genetic resources accessions ex situ.
    2.a / 2.c — Agriculture share of Government Expenditure; Agriculture
    value added share of GDP; Agriculture orientation index; IFPA by Food CPI
    or by product (Wheat, Maize, Rice, Sorghum, Millet).
    CoHD / diet affordability — Cost of a healthy diet (PPP or LCU); PUA;
    NUA; food-group costs (starchy staples, animal source foods, legumes,
    vegetables, fruits, oils and fats) in PPP or LCU.
    5.a land rights — legal guarantees; ownership/secure rights by sex;
    share of women among owners/rights-bearers.
    6.4 water — Level of water stress and Water Use Efficiency by sector
    (Agriculture, Industries, Services, No breakdown).
    14.* fisheries — fish stocks within biologically sustainable levels;
    IUU instruments; sustainable fisheries share of GDP; small-scale access.
    15.* land / forest / mountain — Forest area and shares; forest management
    / biomass / change rate; Mountain Green Cover Index and green cover area
    by zone (Montane, Remaining moutain area, Total, Alpine, Nival) × land
    cover; degraded mountain land area/proportion; mountain area; PGRFA /
    SMTA frameworks.
    Census holdings — Holdings by land size class; parcels; tenure forms;
    civil holders by sex/age; household members (incl. engaged in agriculture);
    employees on the holding; Holdings without land.
- name: food_value_code
  type: STRING
  description: food value code
- name: food_value
  type: STRING
  description: >
    Food value-chain segment when populated (often null on pure SDG/CoHD
    rows). Filter with an exact food_value only for value-chain questions.
    Never invent labels.

    Family rules:
    FAH — Food At Home (FAH).
    FAAFH — Food and Accommodation Away From Home (FAAFH).
- name: industry_code
  type: STRING
  description: industry code
- name: industry
  type: STRING
  description: >
    Industry sector for food value-chain factor rows when populated (often
    null on pure SDG rows). Filter with an exact industry. Prefer Total
    Industries only when totals are asked. Never invent labels.

    Family rules:
    Primary / manufacturing — Agriculture, Forestry and Fishing; Manufacture
    of food, beverages and tobacco products.
    Trade / services — Wholesale and retail trade; Transportation and storage;
    Accommodation and food service activities.
    Totals — Total Industries.
- name: factor_code
  type: STRING
  description: factor code
- name: factor
  type: STRING
  description: >
    Primary factor / cost component for food value-chain rows when populated
    (often null on pure SDG rows). Filter with an exact factor. Prefer Primary
    Factors Total only when totals are asked. Never invent labels.

    Family rules:
    Factors — Labour, Operating surplus, Taxes, Import, Primary Factors Total.
- name: release_code
  type: STRING
  description: release code
- name: release
  type: STRING
  description: >
    Data release / SOFI vintage when populated. Filter with an exact release
    when a specific report update is asked. Prefer the latest SOFI release
    unless an older vintage is named.

    Family rules:
    SOFI / updates — July 2025 (SOFI report); December 2024 (Update).
- name: census_year_code
  type: STRING
  description: census year code
- name: census_year
  type: STRING
  description: Agricultural census year label when populated (census holding rows)
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element (one metric
    per query). Do not mix elements in the same SUM/AVG. Always read value
    together with unit. Prefer Value over Confidence interval bounds unless
    uncertainty is asked.

    Family rules:
    Core measure — Value; Confidence interval: Upper bound; Confidence
    interval: Lower bound.
    Counts / area — Number; Area; Average area; Average number of parcels per
    holding; Average persons per holding (household members / employees).
    Shares / percents — Percent of total persons (holders / household
    members); Percentage of total area; Percent of total number; Factor share;
    Industry share.
    Money / values — Value (2017 constant prices); Value US$; Value Local
    Currency; Value SLC, 2015 prices; Value US$, 2015 prices.

    Default for most SDG/CoHD questions → Value.
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit;
    never compare or SUM unlike units.

    % — shares, prevalences, proportions, scores expressed as percent.
    million No / 1000 No / No — counts of people, holdings, breeds, agreements.
    km2 / 1000 ha / ha — area measures.
    Score — index/score metrics (e.g. 2.4.1 proxy scores).
    USD/m3 — water use efficiency money per cubic metre.
    t/ha — productivity (tonnes per hectare).
    Int$ (PPP) per person per day / LCU/cap/d / USD_PPP/cap / USD_PPP —
    CoHD and related diet-cost measures.
    million USD / million LCU / million SLC — monetary aggregates.
- name: value
  type: FLOAT64
  description: >
    Numeric measure for the element. SUM across items/years only when element
    and unit are homogeneous. Never SUM across different elements, unlike
    units, or unrelated item families (SDG vs CoHD vs census vs value-chain).
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
