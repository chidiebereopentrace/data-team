table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_prices
description: FAOSTAT producer prices, CPI, deflators, exchange rates.
grain: country × product × element × year × month
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × product × element × year × month
semantic_role:
