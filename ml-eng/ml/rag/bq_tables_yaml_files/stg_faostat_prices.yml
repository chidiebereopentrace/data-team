table_name: opentrace-prod-5ga4.staging_dev.stg_faostat_prices
description: >
  FAOSTAT producer prices, PPI, CPI/food inflation, deflators, and exchange
  rates. Rows are country-level facts (not continent aggregates). Filter by
  exact product_name + element (+ currency/unit); never invent labels. Do not
  mix LCU producer prices with index/deflator/FX rows in one SUM.
grain: country × product × element × year × month
entity_type: faostat
source:
  layer: staging_dev
  domain: faostat
relationships:
  primary_key:
    type: logical
    fields: country × product × element × year × month
semantic_role:
  primary_domain: faostat
  supports: &id001
  - prices
  - faostat
business_questions_supported:
- What are producer prices for a crop?
- What is the producer price index or food CPI?
- What is the exchange rate (local currency per USD)?
- How do producer prices compare across countries for a commodity?
filtering_guidance:
- Filter by geography and time when present
- country_name holds country labels only — never filter country_name = 'Africa' or a region
- For continental price comparisons stay on this table; do not invent dim_* geo tables
- This table mixes producer prices, PPI, CPI/food inflation, deflators, and FX — filter product_name+element to one series family
- Never SUM across unlike elements, units, or currencies
- Filter element to exactly one metric; always pair with matching unit/currency when present
- Prefer Producer Price (LCU/tonne) or Producer Price (USD/tonne) / Producer Price (SLC/tonne) with a primary commodity for producer-price questions
- Prefer PPI/CPI elements (and CPI product labels) for index questions; prefer Local currency units per USD / Standard local currency units per USD for FX
- Prefer primary commodities over rollups (Agriculture, Livestock, Meat/Milk Total, Cereals primary, … Total, CPI index products) unless totals/indices are asked
- Prefer non-(biological) meat/milk labels unless the biological series is asked
- Never convert currencies in SQL without an explicit FX element/series
- Filter months when a monthly series is asked; filter year for time-bounded questions
sql_generation_hints:
- Filter country_name and year
- Always filter element = '<exact label>' for the metric needed
- Filter product_name = '<exact FAOSTAT label>' when a commodity or index product is named
- GROUP BY country_name, product_name, year when comparing (include months when comparing months)
- Continental price ranking: AVG(value) or latest year GROUP BY country_name; single-table; no dim_geography
- Never invent warehouse dimension tables (dim_*)
columns:
- name: area_code
  type: STRING
  description: FAO area code
- name: area_code_m49
  type: STRING
  description: UN M49 area code for the country row (not a continent filter key)
- name: country_name
  type: STRING
  description: Country name only (e.g. Nigeria, Kenya). Never 'Africa' or a region label.
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: product_name
  type: STRING
  description: >
    FAOSTAT price-series product / commodity / index label. Filter with an
    exact product_name. Prefer primary commodities over rollups and CPI/
    deflator products unless totals or indices are asked. Prefer
    non-(biological) meat/milk labels unless biological is asked. Never invent
    labels.

    Family rules:
    Meats, milk, eggs — cattle/sheep/goat/pig/poultry meats, raw milk, eggs;
    biological variants exist for many meats.
    Crops — cereals, roots/tubers, pulses, oilcrops, vegetables, fruits, nuts,
    spices, fibres, stimulants (coffee, tea, cocoa, tobacco).
    Aggregates — Agriculture, Livestock, Meat/Milk Total, Cereals primary,
    Roots and Tubers Total, Pulses Total, Fruit/Vegetable totals, etc.
    CPI / inflation / deflators — Consumer Prices General/Food Indices,
    Food price inflation, GDP Deflator, GFCF Deflator, Value Added Deflators.
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: >
    Metric type for the row's value. Filter with an exact element (one metric
    per query). Do not mix elements in the same SUM/AVG. Always read value
    with unit and currency when present.

    Family rules:
    Producer prices — Producer Price (LCU/tonne), Producer Price (USD/tonne),
    Producer Price (SLC/tonne).
    Indices — Producer Price Index (2014-2016 = 100); CPI often carried via
    product labels with Value / related elements.
    Exchange rates — Local currency units per USD; Standard local currency
    units per USD.
    Value measures — Value; Value US$, 2015 prices; Value Standard Local
    Currency, 2015 prices.
    Rare label — Element (use only when present in data).

    Defaults: producer prices → Producer Price (LCU/tonne) or USD/tonne when
    cross-country comparable money is asked; FX → Local currency units per USD.
- name: months_code
  type: STRING
  description: months code (when populated)
- name: months
  type: STRING
  description: Month label for monthly series (when populated). Filter when a specific month is asked.
- name: iso_currency_code
  type: STRING
  description: ISO currency code when present; pair with currency / LCU elements.
- name: currency
  type: STRING
  description: >
    Currency name for LCU/SLC price or FX rows. Filter with an exact currency
    label when comparing local-currency series. Prefer exact labels (incl.
    historical names); do not invent. Sentinel label Currency may appear.

    Family rules:
    Current African currencies — Naira, Kenyan Shilling, CFA Franc BCEAO/BEAC,
    Rand, Egyptian Pound, Ethiopian Birr, etc.
    Historical / revalued — New Kwanza, Ghana Revalued Cedi, New Zaire,
    Zimbabwe Dollar (old), Second Zimbabwe Dollar, etc.
    International — US Dollar, Euro, Pound Sterling, French Franc.
- name: year
  type: INT64
  description: Observation year
- name: unit
  type: STRING
  description: >
    Unit of value for this element. Always interpret value with element + unit
    (+ currency when present); never compare or SUM unlike units.

    USD / SLC / LCU — money units for prices or FX-related series.
    % — index/inflation shares when applicable.
    Unit — generic unit label when present.
- name: value
  type: FLOAT64
  description: >
    Numeric price/index/FX measure for the element. SUM/AVG across products or
    years only when element, unit, and currency are homogeneous. Never SUM
    across different elements or unlike units/currencies.
- name: source_natural_key
  type: STRING
  description: source natural key
- name: loaded_at
  type: STRING
  description: loaded at
