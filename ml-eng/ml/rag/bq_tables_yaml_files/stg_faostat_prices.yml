  type: STRING
  description: country name
- name: item_code
  type: STRING
  description: item code
- name: item_code_cpc
  type: STRING
  description: item code cpc
- name: product_name
  type: STRING
  description: product name
- name: element_code
  type: STRING
  description: element code
- name: element
  type: STRING
  description: element
- name: months_code
  type: STRING
  description: months code
- name: months
  type: STRING
  description: months
- name: iso_currency_code
  type: STRING
  description: iso currency code
- name: currency
  type: STRING
  description: currency
- name: year
  type: INT64
  description: year
- name: unit
  type: STRING
  description: unit
- name: value
  type: FLOAT64
  description: value
- name: source_natural_key
  type: STRING
