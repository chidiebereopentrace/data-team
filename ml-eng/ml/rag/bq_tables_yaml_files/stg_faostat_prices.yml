_index_domain: faostat
_index_tags: *id001
semantic_relationships:
  joins_with:
  - table: stg_fews_market_prices
    'on':
    - country≈country_name
    - product_name
    - year
    how: compare
    note: Watch currency/unit differences
  - table: stg_wfp_vampire_prices
    'on':
    - country≈country_name
    - product_name
    - year
    how: compare
    note: National vs market retail series
  - table: stg_faostat_production
    'on':
    - country_name
    - product_name
    - year
    how: enrich
    note: Prices with production
  companions:
  - table: stg_africa_gdp_ppp
    when: real income context
    role: enrich_context
  do_not_join:
  - table: stg_isda_soil_enriched
    reason: soil long-format; no price grain
  - table: dim_geography
    reason: not in staging catalog; never invent geo dims for Africa country lists
