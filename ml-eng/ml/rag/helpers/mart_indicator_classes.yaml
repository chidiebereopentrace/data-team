version: "2026.8"
# OpenTrace indicator classes (Mart Complete Guide §6) — routing spine for mart BQ reasoner.
classes:
  EL:
    code: EL
    name: Economic and livelihood
    public_examples:
      - What share of agricultural employment is held by women in Ghana?
      - How does farm income compare to off-farm income for smallholders in Kenya?
    aliases:
      - employment
      - agricultural employment
      - farm income
      - off-farm income
      - value added
      - gdp share
      - livelihood
      - economics
    primary_facts:
      - fct_employment
      - fct_economics
      - fct_household
      - agg_employment_country_year
      - agg_economics_country_year
      - fct_population_dynamics
    companion_facts:
      - dim_indicator
      - dim_geography
      - dim_source
      - dim_date
      - dim_item
      - dim_element
      - dim_sex
      - dim_household
      - dim_ref_country
      - gold_dim_indicator
      - gold_dim_geography
      - gold_dim_source
      - bridge_household_crop
      - bridge_household_livestock
      - bridge_household_disease
    do_not_mix:
      - tables: [fct_employment, fct_household]
        reason: Do not union employment % shares with household income sample rows without grain caveat
    families:
      - id: ag_employment_share
        table: fct_employment
        filters: "Join dim_indicator; filter unit='%' and sex when question specifies; use indicator_key"
        example_claim: Agricultural employment share by sex in country-year
      - id: farm_offfarm_income
        table: fct_household
        filters: farm_income vs offfarm_income columns; sample not census
        example_claim: Farm vs off-farm income in ILRI household sample
      - id: employment_country_year
        table: agg_employment_country_year
        filters: Country × indicator × sex × year × source
        example_claim: National employment rollup beside fct_employment
      - id: economics_country_year
        table: agg_economics_country_year
        filters: Country × item × measurement_form × year × source
        example_claim: National economics rollup beside fct_economics
      - id: population_dynamics
        table: fct_population_dynamics
        filters: geo_key × time_key × source; population_count
        example_claim: Population count for a place and year

  GYI:
    code: GYI
    name: Gender, youth and inclusion
    aliases:
      - gender
      - youth
      - inclusion
      - women control
      - land rights
      - sdg 5
    primary_facts:
      - fct_gender_inclusion
      - fct_household
      - fct_employment
    companion_facts:
      - dim_geography
      - dim_source
      - dim_date
      - dim_indicator
      - dim_item
      - dim_element
      - dim_sex
      - dim_household
      - gold_dim_geography
      - gold_dim_source
      - gold_dim_indicator
      - bridge_household_crop
      - bridge_household_livestock
      - bridge_household_disease
    do_not_mix:
      - tables: [fct_gender_inclusion, fct_household]
        reason: Never union SDG national gender rows with household control scores
    families:
      - id: sdg_national
        table: fct_gender_inclusion
        filters: Official SDG indicators; national grain
      - id: hh_control_scores
        table: fct_household
        filters: Survey sample control scores; not SDG official

  FVC:
    code: FVC
    name: Food system and value chain
    aliases:
      - value chain
      - food system
      - losses
      - forestry
      - food balance
    primary_facts:
      - fct_economics
      - fct_food_balance
      - fct_prices
      - fct_trade
      - fct_forestry
      - agg_food_balance_country_year
      - agg_forestry_country_year
      - fct_value_chain
      - fct_market_access
    companion_facts:
      - dim_product
      - dim_geography
      - dim_source
      - dim_item
      - dim_element
      - dim_unit
      - dim_market
      - dim_market_fews
      - dim_date
      - dim_audit
      - dim_trade_flow
      - gold_dim_geography
      - gold_dim_source
      - gold_dim_unit
    do_not_mix:
      - tables: [fct_trade, fct_food_balance]
        reason: Filter trade_grain before border vs national trade claims
    families:
      - id: trade_grain
        table: fct_trade
        filters: "trade_grain in (fews_border_month, faostat_country_year)"
      - id: food_losses
        table: fct_food_balance
        filters: losses via element_code; SUA disappearance not farm-gate waste
      - id: food_balance_country_year
        table: agg_food_balance_country_year
        filters: Country × product × year × source
      - id: forestry_country_year
        table: agg_forestry_country_year
        filters: Country × item × forestry_grain × year × source
      - id: value_chain_share
        table: fct_value_chain
        filters: geo_key × time_key × product_key × source; value_share
      - id: market_access
        table: fct_market_access
        filters: geo_key × time_key × market_key × source; access_index and distance_to_market

  FS:
    code: FS
    name: Food security and nutrition
    public_examples:
      - How many people are in IPC Phase 3 or above in Ethiopia?
      - What is the food security outlook for the Sahel this year?
    aliases:
      - food security
      - food insecurity
      - ipc
      - famine
      - fies
      - humanitarian food
      - crisis phase
    primary_facts:
      - fct_food_security
      - fct_household
      - fct_humanitarian
      - fct_food_balance
      - agg_food_security_monthly
      - agg_food_security_country_month
    companion_facts:
      - agg_food_security_monthly
      - dim_classification
      - dim_scenario
      - dim_geography
      - dim_source
      - dim_date
      - dim_household
      - dim_item
      - dim_element
      - dim_product
      - dim_status
      - gold_dim_geography
      - gold_dim_source
      - bridge_household_crop
      - bridge_household_livestock
      - bridge_household_disease
    do_not_mix:
      - tables: [fct_food_security]
        reason: "measure_type=population vs classification — never union in one query"
    families:
      - id: ipc_population
        table: fct_food_security
        filters: "measure_type='population'; exclude classification-only rows"
      - id: ipc_classification
        table: fct_food_security
        filters: "measure_type='classification'; scenario_name for outlook"
      - id: household_fies
        table: fct_household
        filters: fies_score; project sample not national census
      - id: food_security_country_month
        table: agg_food_security_country_month
        filters: Country × measure_type × month × source

  PROD:
    code: PROD
    name: Agricultural production
    public_examples:
      - What was maize production in Nigeria in 2022?
      - How has rice output in Kenya changed since 2015?
    aliases:
      - production
      - harvest
      - output
      - yield
      - tonnes
      - crop production
    primary_facts:
      - fct_production
      - fct_yield
      - agg_production_annual
      - agg_production_country_year
      - agg_production_country_season
    companion_facts:
      - dim_product
      - dim_geography
      - dim_source
      - dim_element
      - dim_season
      - dim_date
      - dim_faostat_area
      - dim_production_system
      - gold_dim_geography
      - gold_dim_source
      - gold_dim_season
      - agg_production_country_year
      - bridge_season_calendar
      - bridge_household_crop
    do_not_mix:
      - tables: [fct_production, fct_yield]
        reason: FAOSTAT country-year production vs FNID-season yield — never mix
    families:
      - id: faostat_country_year_physical
        table: fct_production
        filters: "production_grain='physical'; metric or element for qty"
        do_not_mix_with: [fnid_season_yield]
      - id: faostat_index_gross_value
        table: fct_production
        filters: "production_grain in ('index','gross_value')"
      - id: fnid_season_yield
        table: fct_yield
        filters: season_key / harvest_year; subnational FNID grain
        do_not_mix_with: [faostat_country_year_physical]
      - id: agg_country_year
        table: agg_production_annual
        filters: Prefer for national annual rollups
      - id: agg_production_country_year_panel
        table: agg_production_country_year
        filters: Multi-country national annual production panel
      - id: agg_production_country_season_panel
        table: agg_production_country_season
        filters: National production by season when season grain is required

  PRC:
    code: PRC
    name: Prices and markets
    public_examples:
      - How have rice prices changed in Senegal over the last five years?
      - What are retail maize prices in urban markets in Malawi?
    aliases:
      - price
      - prices
      - retail price
      - market price
      - producer price
      - wholesale
    primary_facts:
      - fct_prices
      - agg_prices_country_month
    companion_facts:
      - dim_market
      - dim_market_fews
      - dim_geography
      - dim_product
      - dim_unit
      - dim_currency
      - dim_source
      - dim_date
      - gold_dim_geography
      - gold_dim_source
      - gold_dim_unit
      - agg_prices_country_month
    do_not_mix:
      - tables: [fct_prices]
        reason: "Filter price_source (fews/wfp/faostat) — do not blend without explicit caveat"
    families:
      - id: fews_market
        table: fct_prices
        filters: "price_source='fews'; common_unit_price may be populated"
      - id: wfp_market
        table: fct_prices
        filters: "price_source='wfp'; common_unit_price often null"
      - id: faostat_national
        table: fct_prices
        filters: "price_source='faostat'; national country×item×element grain"
      - id: prices_country_month
        table: agg_prices_country_month
        filters: Country × product × month; national price rollup beside fct_prices

