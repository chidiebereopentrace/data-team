version: "2026.8"
# (measure, geo_grain, time_grain [, breakdown]) → warehouse capability. Fail closed when no row matches.

entries:
  - measure: production
    geo_grain: africa
    time_grain: year
    table: agg_production_annual
    template: mart_regional_panel
    max_geo_level: national
    contract_sql_only: true

  - measure: production
    geo_grain: region
    time_grain: year
    table: agg_production_annual
    template: mart_regional_panel
    max_geo_level: national
    contract_sql_only: true

  - measure: production
    geo_grain: country
    time_grain: year
    table: agg_production_country_year
    alt_table: fct_production
    template: mart_country_series
    max_geo_level: national
    contract_sql_only: true

  - measure: production
    geo_grain: africa
    time_grain: year
    table: agg_production_annual
    template: mart_regional_panel
    max_geo_level: national
    contract_sql_only: true

  - measure: yield
    geo_grain: country
    time_grain: season
    table: fct_yield
    template: mart_season_climate
    max_geo_level: sub_national
    contract_sql_only: true

  # mart_price covers market, admin-1, country, multi-country and Africa scopes;
  # time_grain latest also matches year and year_range.
  - measure: market_price
    geo_grain: point
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: market_price
    geo_grain: admin2
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: market_price
    geo_grain: admin1
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: market_price
    geo_grain: country
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: market_price
    geo_grain: region
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: market_price
    geo_grain: africa
    time_grain: latest
    table: fct_prices
    template: mart_price
    max_geo_level: national
    contract_sql_only: true

  - measure: food_security_ipc
    geo_grain: country
    time_grain: season
    table: fct_food_security
    template: mart_food_security_snapshot
    max_geo_level: sub_national
    contract_sql_only: true

  - measure: employment_share
    geo_grain: country
    time_grain: year
    breakdown: [sex]
    table: fct_employment
    template: employment_share_by_sex
    required_filters: [country_iso3, sector_agriculture, unit_percent, sex]
    max_geo_level: national
    contract_sql_only: true

  - measure: employment_share
    geo_grain: country
    time_grain: latest
    breakdown: [sex]
    table: fct_employment
    template: employment_share_by_sex
    required_filters: [country_iso3, sector_agriculture, unit_percent, sex]
    max_geo_level: national
    contract_sql_only: true

  - measure: employment_share
    geo_grain: country
    time_grain: year
    table: fct_employment
    template: employment_share_total
    required_filters: [country_iso3, sector_agriculture, unit_percent]
    max_geo_level: national
    contract_sql_only: true

  - measure: employment_share
    geo_grain: admin2
    time_grain: year
    status: unsupported_grain
    max_geo_level: national
    reason: Employment share is national-only in fct_employment

  - measure: trade
    geo_grain: country
    time_grain: year
    table: fct_trade
    template: mart_country_series
    max_geo_level: national
    contract_sql_only: true

  - measure: trade
    geo_grain: region
    time_grain: year
    table: fct_trade
    template: mart_regional_panel
    max_geo_level: national
    contract_sql_only: true

  - measure: protected_area
    geo_grain: country
    time_grain: year
    table: fct_protected_areas
    template: null
    max_geo_level: national
    contract_sql_only: true

  - measure: food_balance
    geo_grain: country
    time_grain: year
    table: fct_food_balance
    template: null
    max_geo_level: national
    contract_sql_only: true

  - measure: rainfall
    geo_grain: admin2
    time_grain: year
    status: unsupported_grain
    max_geo_level: national
    reason: Subnational rainfall not in mart at admin2 grain

  - measure: disease_prevalence
    geo_grain: country
    time_grain: latest
    population: dairy
    status: unsupported_grain
    reason: fct_animal_health is household×species; no national dairy-herd ECF prevalence
    fallback_corpora: [academic_papers, public_reports]
    skip_bq: true
    vector_policy: fallback_only
    contract_sql_only: true

  - measure: hdi
    geo_grain: country
    time_grain: year
    table: fct_hdi
    alt_table: agg_hdi_latest
    template: null
    max_geo_level: national
    contract_sql_only: false

  - measure: gdp
    geo_grain: country
    time_grain: year
    table: fct_economics
    template: null
    max_geo_level: national
    contract_sql_only: false

# Served operations per serving mart table (lookup, latest, series, compare, rank, categorical).
# The coverage ledger checks each declaration against the table shape; an operation not
# listed is refused with the recorded reason. Every serving fct_/agg_ table must appear.
table_operations:
  agg_emissions_country_year: &all_ops
    supported: [lookup, latest, series, compare, rank, categorical]
  agg_food_security_country_month: *all_ops
  agg_food_security_monthly: *all_ops
  agg_hdi_latest:
    supported: [lookup, latest, compare, rank, categorical]
    unsupported:
      series: holds only the latest HDI year per country; use fct_hdi for trends
  agg_prices_country_month: *all_ops
  agg_production_annual: *all_ops
  agg_production_country_year: *all_ops
  agg_production_country_season: *all_ops
  agg_soil_admin:
    supported: [lookup, compare, rank, categorical]
    unsupported:
      latest: admin soil averages carry no time column
      series: admin soil averages carry no time column
  fct_animal_health: *all_ops
  fct_biodiversity: *all_ops
  fct_climate: *all_ops
  fct_economics: *all_ops
  fct_emissions: *all_ops
  fct_employment: *all_ops
  fct_fertilizer: &no_categorical
    supported: [lookup, latest, series, compare, rank]
  fct_food_balance: *all_ops
  fct_food_hazards: *all_ops
  fct_food_security: *all_ops
  fct_forestry: *all_ops
  fct_gender_inclusion: *all_ops
  fct_germplasm: *all_ops
  fct_hdi: *all_ops
  fct_household:
    supported: [lookup, latest, series, compare, categorical]
    unsupported:
      rank: household survey sample, not a census; ranking countries on it misleads
  fct_humanitarian: *all_ops
  fct_insurance: *all_ops
  fct_investment: *all_ops
  fct_land_degradation: *no_categorical
  fct_land_inputs: *all_ops
  fct_machinery: *all_ops
  fct_pesticide: *no_categorical
  fct_prices: *all_ops
  fct_production: *all_ops
  fct_protected_areas: *all_ops
  fct_research_expenditure: *no_categorical
  fct_researchers: *no_categorical
  fct_soil_health: *all_ops
  fct_trade: *all_ops
  fct_vegetation: *all_ops
  fct_yield: *all_ops

geo_level_order:
  point: 0
  admin2: 1
  admin1: 2
  country: 3
  region: 4
  africa: 5

max_geo_level_rank:
  national: 3
  sub_national: 2
  community: 1
  point: 0
