class: FS
warehouse_role: measurable
web_policy: never
default_table: fct_food_security
tables:
  - fct_food_security
  - fct_household
  - fct_humanitarian
  - fct_food_balance
  - agg_food_security_monthly
  - agg_food_security_country_month
joins_when_needed:
  - dim_classification
  - dim_scenario
  - dim_geography
  - dim_source
  - dim_date
  - dim_household
  - dim_item
  - dim_element
  - dim_product
  - dim_status
  - gold_dim_geography
  - gold_dim_source
  - bridge_household_crop
  - bridge_household_livestock
  - bridge_household_disease
default_measures:
  series:
    - value
  panel:
    - value
  outlook:
    - value
coverage:
  agg_food_security_monthly:
    country_iso3:
      - MLI
      - ZWE
      - CAF
hard_rules:
  - If geo not in monthly agg coverage use fct_food_security
  - measure_type population vs classification
columns:
  measure_type:
    role: filter_enum
    prompt_mode: full_list
  scenario_name:
    role: filter_enum
    prompt_mode: resolved_only
  country_iso3:
    role: filter_enum
    prompt_mode: resolved_only
  year:
    role: time_filter
    prompt_mode: stats_only
  metric:
    role: measure
    prompt_mode: resolved_only
exclude_prompt_columns:
  - geo_key
  - scenario_key
  - classification_key
