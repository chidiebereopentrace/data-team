class: FVC
warehouse_role: measurable
web_policy: never
default_table: fct_food_balance
tables:
  - fct_food_balance
  - fct_trade
  - fct_prices
  - fct_economics
  - fct_forestry
  - agg_food_balance_country_year
  - agg_forestry_country_year
  - fct_value_chain
  - fct_market_access
joins_when_needed:
  - dim_product
  - dim_geography
  - dim_source
  - dim_item
  - dim_element
  - dim_unit
  - dim_market
  - dim_market_fews
  - dim_date
  - dim_audit
  - dim_trade_flow
  - gold_dim_geography
  - gold_dim_source
  - gold_dim_unit
hard_rules:
  - Prefer metric slugs over element string matching
  - Filter year INT64 or as_of_date BETWEEN; never EXTRACT(YEAR FROM as_of_date) in WHERE
  - source_natural_key values from complete index only
  - Agri-activities panel uses fct_food_balance + fct_trade (trade_grain family); never union
columns:
  metric:
    role: filter_enum
    prompt_mode: full_list
  source_natural_key:
    role: filter_enum
    prompt_mode: full_list
  unit:
    role: filter_enum
    prompt_mode: full_list
  element:
    role: filter_enum
    prompt_mode: full_list
  product_name:
    role: filter_enum
    prompt_mode: resolved_only
    join: dim_product
    scope: fact_distinct
  country_iso3:
    role: filter_enum
    prompt_mode: resolved_only
  year:
    role: time_filter
    prompt_mode: stats_only
  value:
    role: measure
    prompt_mode: stats_only
exclude_prompt_columns:
  - geo_key
  - scenario_key
  - classification_key
  - product_key
