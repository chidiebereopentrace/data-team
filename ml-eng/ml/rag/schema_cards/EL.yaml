class: EL
warehouse_role: measurable
web_policy: never
default_table: fct_employment
tables:
  - fct_employment
  - fct_economics
  - fct_household
  - agg_employment_country_year
  - agg_economics_country_year
  - fct_population_dynamics
  - dim_indicator
  - dim_geography
joins_when_needed:
  - dim_indicator
  - dim_geography
  - dim_source
  - dim_date
  - dim_item
  - dim_element
  - dim_sex
  - dim_household
  - dim_ref_country
  - gold_dim_indicator
  - gold_dim_geography
  - gold_dim_source
  - bridge_household_crop
  - bridge_household_livestock
  - bridge_household_disease
default_measures:
  series:
    - employment_rate
  panel:
    - employment_rate
columns:
  country_iso3:
    role: filter_enum
    prompt_mode: resolved_only
  year:
    role: time_filter
    prompt_mode: stats_only
  metric:
    role: measure
    prompt_mode: resolved_only
  sex_key:
    role: filter_enum
    prompt_mode: resolved_only
  indicator_key:
    role: entity
    prompt_mode: resolved_only
  value:
    role: measure
    prompt_mode: stats_only
hard_rules:
  - Use indicator_key from resolved labels only
  - Do not mix household and national employment without compare intent
exclude_prompt_columns:
  - geo_key
  - scenario_key
  - classification_key
  - product_key
