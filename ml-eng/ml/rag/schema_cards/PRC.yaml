class: PRC
warehouse_role: measurable
web_policy: never
default_table: fct_prices
tables:
  - fct_prices
  - agg_prices_country_month
  - dim_market
  - dim_geography
  - dim_product
joins_when_needed:
  - dim_market
  - dim_market_fews
  - dim_geography
  - dim_product
  - dim_unit
  - dim_currency
  - dim_source
  - dim_date
  - gold_dim_geography
  - gold_dim_source
  - gold_dim_unit
default_measures:
  series:
    - retail_price
  panel:
    - retail_price
coverage: {}
hard_rules:
  - Use price_type and market_name from resolved labels only
  - Do not mix wholesale and retail in one query without explicit compare intent
columns:
  country_iso3:
    role: filter_enum
    prompt_mode: resolved_only
  year:
    role: time_filter
    prompt_mode: stats_only
  price_type:
    role: filter_enum
    prompt_mode: resolved_only
    scope: fact_distinct
  product_name:
    role: entity
    prompt_mode: resolved_only
    scope: fact_distinct
  metric:
    role: measure
    prompt_mode: resolved_only
exclude_prompt_columns:
  - geo_key
  - scenario_key
  - classification_key
  - product_key
