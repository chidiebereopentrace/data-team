sql_generation_hints:
- LEFT JOIN dim_product p ON f.product_key = p.product_key; filter p.product_name
- LEFT JOIN dim_geography g ON f.geography_key = g.geography_key for country labels
- SUM production qty / area columns; filter year when question is time-bounded
filtering_guidance:
- Default national production panel table (physical grain only)
- Filter country_iso3 or country_name; JOIN dim_product for crop name literals
- Group by source_key when comparing producers
- Do not mix with agg_production_country_season without stating grain
- Prefer over fct_production for country-year volume rollups
