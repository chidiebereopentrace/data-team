name: ML Eng — mart YAML ↔ BQ schema drift

# Scheduled / secrets-required: compare allowlisted mart YAML columns to live BQ.
# PR CI stays on offline contract tests in ml-eng-rag-checks.yml.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r ml-eng/requirements.txt
          pip install google-cloud-bigquery pyyaml
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Check YAML ↔ BQ column drift
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET_GOLD: ${{ secrets.BQ_DATASET_GOLD }}
        run: |
          . .venv/bin/activate
          if [ -z "$BQ_PROJECT" ]; then
            echo "::error::BQ_PROJECT secret not set"
            exit 1
          fi
          export BQ_DATASET_GOLD="${BQ_DATASET_GOLD:-mart_dev}"
          PYTHONPATH=ml-eng python ml-eng/ml/rag/scripts/check_mart_yaml_bq_drift.py
