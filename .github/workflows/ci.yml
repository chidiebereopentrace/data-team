name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  notebook-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nbformat
        run: pip install nbformat
      - name: Check notebook JSON
        run: |
          for f in $(find . -name '*.ipynb' -not -path './.git/*'); do
            python -c "import nbformat; nbformat.read('$f', as_version=4)" || exit 1
          done
