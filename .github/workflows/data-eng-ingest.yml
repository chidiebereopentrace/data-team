name: data-eng-ingest

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "data-eng/ingestion/**"
      - ".github/workflows/data-eng-ingest.yml"

permissions:
  contents: read

jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-eng/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (offline, sockets disabled)
        run: pytest tests -q

