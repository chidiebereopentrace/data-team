name: Data Eng — dbt parse

on:
  push:
    branches: [main, dev]
    paths:
      - 'data-eng/dbt/**'
      - '.github/workflows/data-eng-dbt.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'data-eng/dbt/**'
      - '.github/workflows/data-eng-dbt.yml'

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-eng/dbt
    env:
      DBT_PROFILES_DIR: .
      BQ_PROJECT: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery==1.12.2

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse
